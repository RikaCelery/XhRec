                    const url = '/api/media/' + selected.value.id + '/frame?t=' + t.toFixed(3) + '&w=' + width
                        + (opts.priority ? '&p=1' : '')
                    const response = await fetch(url, { signal: opts.signal })
                    if (!response.ok) throw new Error('frame ' + response.status)
                    const blob = await response.blob()
                    if (opts.signal?.aborted) throw new Error('aborted')
                    const bitmap = await createImageBitmap(blob)
                    // A wide source crops rather than stretches: the cell owns 16:9 and the
                    // extra rows would otherwise squash the picture. It is also what makes
                    // the fill arithmetic exact — a frame cut at `w` is `w * 9/16` tall,
                    // which is the height [thumbFrameWidth] sized it for.
                    const target = Math.max(1, Math.round(width * 9 / 16))
                    const canvas = document.createElement('canvas')
                    canvas.width = width; canvas.height = target
                    const ctx = canvas.getContext('2d')
                    const scale = Math.max(width / bitmap.width, target / bitmap.height)
                    const drawW = bitmap.width * scale, drawH = bitmap.height * scale
                    ctx.drawImage(bitmap, (width - drawW) / 2, (target - drawH) / 2, drawW, drawH)
                    bitmap.close()
                    const cropped = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82))
                    if (!cropped || opts.signal?.aborted) throw new Error('aborted')
                    return { url: URL.createObjectURL(cropped), w: width }
                }

                /**
                 * Requests the frame to show above the pyramid, at the cursor.
                 *
                 * The popup is the one request with a human waiting on it, so it goes
                 * out on the priority lane and is deduplicated against the sweep: it
                 * never waits for a slot behind it, and it never spends a second request
                 * on a frame the sweep is already producing.
                 */
                let hoverKey = null, hoverPending = false
                function loadHoverFrame(level, t) {
                    if (!selected.value) return
                    const key = frameKey(level, t)
                    if (hoverCache.has(key)) return
                    hoverKey = key
                    if (hoverPending) return
                    hoverPending = true
                    const controller = new AbortController()
                    thumbAbort.add(controller)
                    fetchFrame(level, t, HOVER_WIDTH, { priority: true, signal: controller.signal })
                        .then(frame => {
                            // A frame the cursor has already left is still worth keeping —
                            // it is the instant the popup comes back to. Caching it under
                            // the key it was *asked* for is what makes that possible; the
                            // popup looks up the cell it is on now, so a stale arrival
                            // cannot paint itself over a newer one.
                            rememberFrame(hoverCache, key, frame)
                        })
                        .catch(() => { /* keep the frame already on screen */ })
                        .finally(() => {
                            thumbAbort.delete(controller)
                            hoverPending = false
                            // The cursor kept moving while this was in flight: ask for
                            // wherever it is now. Never more than one hop behind.
                            if (hoverKey && hoverKey !== key) {
                                const [lvl, time] = hoverKey.split(':')
                                if (!hoverCache.has(hoverKey)) loadHoverFrame(Number(lvl), Number(time))
                            }
                        })
                }

                // ------------------------------------------------- hover preview
                /**
                 * The frame popup, shown only while the pointer is on the thumbnail lane.
                 *
                 * It is deliberately not a tooltip on every lane: the only place whose
                 * content is "the picture at this instant" is the thumbnail strip, and a
                 * popup that followed the cursor across the clip and event lanes would be
                 * in the way of the thing the user is actually pointing at.
                 */
                const hoverPreviewOpen = ref(false)
                let hoverPreviewEnabled = false
                /** Where the pointer is, in the two coordinate systems the overlays need. */
                const hoverState = { time: 0, cell: 0, clientX: 0, contentX: 0 }
                const hoverCell = ref(null)
                const hoverTick = ref(0)
                /** Latest pointer position over the lane, replayed when the window scrolls. */
                let lastPointer = { clientX: 0, clientY: 0 }

                /**
                 * The grid the popup asks on: as fine as the frame cache allows, and no
                 * finer than the pointer can actually resolve.
                 *
                 * The lane's own levels are far too coarse to hang a popup off — at a deep
                 * zoom one cell is seconds wide, and snapping the preview to its start puts
                 * the frame visibly beside the cursor. The cache's own 0.1 s grid is what a
                 * frame *is*, so that is the floor; the 8 px term coarsens it when a step is
                 * narrower than the pointer's own resolution, which is what stops a fast sweep
                 * from asking for more frames per second than the cursor can express.
                 */
                function hoverGridSeconds() {
                    return Math.max(FRAME_BUCKET, 8 / Math.max(pxPerSecond.value, 1e-9))
                }

                /** The instant the cursor is over, on the popup's own grid. */
                function setHoverTime(time) {
                    const step = hoverGridSeconds()
                    const t = round3(Math.round(time / step) * step)
                    if (hoverState.time === t) return
                    hoverState.time = t
                    // Fresh object so Vue re-renders the popup; the popup itself keeps the
                    // previous frame on screen until the requested one can be decoded.
                    hoverCell.value = { level: levelForStep(step), t, end: Math.min(duration.value, t + step) }
                    hoverTick.value++
                }

                function updateHoverCell(event) {
                    const el = viewport.value
                    if (!el || !selected.value || !(duration.value > 0)) return
                    const box = el.getBoundingClientRect()
                    const t = pxToTime(event.clientX - box.left + el.scrollLeft)
                    if (!isFinite(t)) return
                    const at = clamp(t, 0, duration.value)
                    setHoverTime(at)
                    // Anchored to the *cursor*, not to the frame that gets shown. The popup's
                    // grid is coarse on purpose — one step can be several hundred pixels at a
                    // deep zoom — so hanging the overlay off `hoverState.time` would park it
                    // visibly beside the pointer, drifting further the deeper the zoom.
                    hoverState.clientX = event.clientX
                    // The mark is a child of the scrolled content, so it needs the cursor in
                    // content coordinates; the popup is fixed and needs it in client ones.
                    hoverState.contentX = event.clientX - box.left + el.scrollLeft
                    loadHoverFrame(hoverCell.value.level, hoverState.time)
                }

                function onLaneHover(event) {
                    if (drag.value) return
                    lastPointer = { clientX: event.clientX, clientY: event.clientY }
                    hoverPreviewEnabled = true
                    hoverPreviewOpen.value = showThumbnails.value
                    updateHoverCell(event)
                }
                function closeHoverPreview() {
                    hoverPreviewEnabled = false
                    hoverPreviewOpen.value = false
                }

                /**
                 * The best frame already in memory for the instant under the cursor.
                 *
                 * The popup should show *something* the moment the cursor lands, so this
                 * falls back to any coarser level whose frame still covers this instant —
                 * those frames are already cached from the lane's own coarse pass, so the
                 * fallback costs nothing and the finer frame sharpens it in place.
                 */
                const hoverPreview = computed(() => {
                    hoverTick.value
                    thumbnailRevision.value
                    const cell = hoverCell.value
                    if (!cell) return null
                    const exact = hoverCache.get(frameKey(cell.level, cell.t))
                    if (exact) return exact.url
                    // Fall back to progressively coarser frames: the popup's own grid is
                    // far finer than the lane's rungs, so a hit at 0.1 s is unlikely while
                    // anything is still loading, and an instant that already has a coarse
                    // frame should show it rather than nothing.
                    let best = null, bestLevel = -1
                    for (let step = cell.end - cell.t, depth = 0; depth < 6; step *= 4, depth++) {
                        const level = levelForStep(step)
                        const t = round3(Math.floor(cell.t / step) * step)
                        if (!(t <= cell.t && t + step > cell.t)) continue
                        const entry = hoverCache.get(frameKey(level, t)) || thumbnailCache.get(frameKey(level, t))
                        if (entry && level > bestLevel) { best = entry.url; bestLevel = level }
                    }
                    return best
                })
                const hoverTimecode = computed(() => { hoverTick.value; return hoverState.time })
                /** Margin between the popup and the edges of the timeline viewport. */
                const HOVER_MARGIN = 6
                /** Ceiling on the popup, so it stays a preview rather than a second player. */
                const HOVER_MAX_HEIGHT = 240
                /**
                 * The inline styles for the popup and its ruler mark.
                 *
                 * The popup is `position: fixed` and placed relative to the **thumbnail
                 * lane**, not to any scrolling content: that is what lets it sit above the
                 * lane, over the transport bar, without being clipped by the timeline's own
                 * `overflow` — and what keeps it under the cursor when the lane scrolls or
                 * the zoom changes, because its anchor is measured from the lane's current
                 * box every time rather than derived from a scroll offset.
                 *
                 * Above the lane is preferred, so the ruler and the lanes stay visible.
                 * When the timeline is already near the top of the window there is no room
                 * up there, and the fallback is the strip of clip lane directly below the
                 * thumbnails — never the ruler above them, which is the one thing a preview
                 * must not hide.
                 */
                const hoverStyle = computed(() => {
                    hoverTick.value
                    const el = viewport.value
                    const lane = thumbnailLaneBox()
                    if (!el || !lane) return {}
                    const lanePx = laneHeights.value.thumbnails
                    // Measured from the top of the *timeline panel*, not of the lane: the
                    // ruler and the editing toolbar sit in between, and a preview that
                    // covers them hides the very context it is meant to be read against.
                    const above = el.getBoundingClientRect().top
                    // Sized from the lane itself — a few thumbnails tall — so the preview
                    // relates to what the user chose to make the strip, not to how tall the
                    // window happens to be. The ceiling is what keeps it a preview.
                    const wanted = clamp(lanePx * 3, 96, HOVER_MAX_HEIGHT)
                    const roomAbove = above - HOVER_MARGIN * 2
                    let h, top
                    if (roomAbove >= 72) {
                        h = Math.round(Math.min(wanted, roomAbove))
                        top = above - h - HOVER_MARGIN
                    } else {
                        // No room above: tuck it under the lane, sized to the lane itself, so
                        // it reads as part of the strip instead of covering the timeline.
                        const roomBelow = Math.max(0, innerHeight - lane.bottom - HOVER_MARGIN * 2)
                        // Tucking *under* the lane keeps the ruler visible, which is what
                        // matters when there is nowhere above the panel to float.
                        h = Math.round(clamp(Math.min(wanted, roomBelow), 56, lanePx))
                        top = lane.bottom + HOVER_MARGIN
                    }
                    const w = Math.round(h * 16 / 9)
                    return {
                        top: Math.round(top) + 'px',
                        left: Math.round(clamp(hoverState.clientX - w / 2, HOVER_MARGIN,
                            Math.max(HOVER_MARGIN, innerWidth - w - HOVER_MARGIN))) + 'px',
                        width: w + 'px',
                        height: h + 'px'
                    }
                })
                /** The thumbnail lane's current box, or null when it is not on screen. */
                function thumbnailLaneBox() {
                    const el = document.querySelector('[data-lane="thumbnails"]')
                    return el ? el.getBoundingClientRect() : null
                }
                /**
                 * The cursor's instant, marked on the ruler.
                 *
                 * The mark is a child of the scrolled content, so its offset has to be in
                 * content coordinates — which is what `hoverState.contentX` records. (The
                 * popup above it is fixed-positioned and needs client coordinates instead;
                 * the two anchors are deliberately different.)
                 */
                const hoverMarkLeft = computed(() => {
                    hoverTick.value
                    return hoverState.contentX + 'px'
                })

                function queueThumbTask(cell) {
                    if (thumbQueued.has(cell.key)) return
                    thumbQueued.set(cell.key, cell)
                    if (thumbQueued.size > MAX_PLANNED_CELLS * 2) {
                        // Far more than one screenful; the plan is rebuilt constantly, so
                        // dropping the margin cells on the far side costs nothing.
                        for (const key of thumbQueued.keys()) {
                            if (thumbQueued.size <= MAX_PLANNED_CELLS) break
                            if (!thumbQueued.get(key)?.visible) thumbQueued.delete(key)
                        }
                    }
                    pumpThumbs()
                }

                function pumpThumbs() {
                    for (const cell of thumbQueued.values()) {
                        if (thumbActive >= FETCH_CONCURRENCY) return
                        thumbQueued.delete(cell.key)
                        startThumbTask(cell)
                    }
                }

                function startThumbTask(cell) {
                    const controller = new AbortController()
                    thumbAbort.add(controller)
                    thumbActive++
                    fetchFrame(cell.level, cell.t, cell.width, { signal: controller.signal })
                        .then(frame => rememberFrame(thumbnailCache, cell.key, frame))
                        .catch(() => { /* an aborted or missing frame is simply not drawn */ })
                        .finally(() => {
                            thumbAbort.delete(controller)
                            thumbActive--
                            pumpThumbs()
                            // The queue is finite, so a region the plan never covered —
                            // after a seek, or a scroll between two reschedules — would
                            // otherwise sit empty forever.
                            scheduleThumbRefresh()
                        })
                }

                /**
                 * Asks the server to sweep a level while the client fetches the frames it
                 * can show.
                 *
                 * The browser opens only a handful of connections per origin, so a client
                 * that fetched a coarse level image by image would crawl. The server can
                 * sweep it at its own concurrency and answer with the grid; by the time
                 * the client asks for a specific frame it is a cache hit.
                 *
                 * The sweep is asked for the width the level's own cells will want, so the
                 * frames it bakes are the ones the lane then reads.
                 */
                function requestLevelSweep(level, id) {
                    if (!(duration.value > 0) || sweepRequested.has(level)) return
                    const { from, to } = viewWindow.value
                    const span = Math.max(levelStep(level), to - from)
                    const margin = span * 0.5
                    const t0 = Math.max(0, from - margin), t1 = Math.min(duration.value, to + margin)
                    if (!(t1 > t0)) return
                    sweepRequested.add(level)
                    const width = thumbFrameWidth(levelStep(level) * (pxPerSecond.value || 0))
                    fetch('/api/media/' + id + '/frames?t0=' + t0.toFixed(3) + '&t1=' + t1.toFixed(3)
                        + '&step=' + levelStep(level).toFixed(3) + '&w=' + width)
                        .then(r => { if (!r.ok) sweepRequested.delete(level) })
                        .catch(() => sweepRequested.delete(level))
                }

                function stopThumbnails() {
                    clearTimeout(planTimer); planTimer = null
                    thumbGeneration++
                    for (const c of thumbAbort) c.abort()
                    thumbAbort.clear()
                    thumbQueued.clear()
                    sweepRequested.clear()
                    thumbActive = 0
                }
                function clearThumbnailCaches() {
                    for (const entry of [...thumbnailCache.values(), ...hoverCache.values()]) URL.revokeObjectURL(entry.url)
                    thumbnailCache.clear(); hoverCache.clear(); thumbEnum.clear()
                    hoverKey = null; hoverPending = false
                    thumbnailRevision.value++
                }
                function scheduleThumbnails() {
                    // Every reschedule is a new plan: whatever was queued belongs to a
                    // window or zoom that no longer exists, so it is dropped rather than
                    // continued. The frames themselves stay cached, so nothing is redone.
                    if (planTimer) clearTimeout(planTimer)
                    thumbGeneration++
                    thumbQueued.clear()
                    sweepRequested.clear()
                    thumbPlannedAt = 0
                    if (!selected.value || !showThumbnails.value || drag.value?.kind === 'scrub') return
                    planTimer = setTimeout(() => {
                        planTimer = null
                        thumbPlannedAt = Date.now()
                        const id = selected.value?.id
                        if (id) {
                            for (const level of planLevels()) requestLevelSweep(level, id)
                        }
                        for (const cell of thumbnailPlan.value) queueThumbTask(cell)
                    }, 220)
                }

                /** Schedules a refresh when the plan has gone stale for a while. */
                function scheduleThumbRefresh() {
                    if (planTimer) return
                    if (Date.now() - thumbPlannedAt < 400) return
                    scheduleThumbnails()
                }

                /**
                 * Cells of one pyramid level already in memory.
                 *
                 * Which level the lane stops subdividing at is the whole point of the
                 * design, and it depends on the window, the zoom and the recording's
                 * length at once. This reports the answer rather than the inputs.
                 */
                function thumbnailLevel(level) {
                    thumbnailRevision.value
                    let count = 0
                    for (const key of thumbnailCache.keys()) if (Number(key.split(':')[0]) === level) count++
                    return count
                }
                /** Coarse-to-fine progress, for the timeline's own diagnostics. */
                const thumbnailProgress = computed(() => {
                    thumbnailRevision.value
                    const out = []
                    for (let level = 0; level <= thumbnailTarget.value; level++) {
                        out.push([level, levelStep(level), thumbnailLevel(level)])
                    }
                    return out
                })
                /**
                 * Frame URLs this session holds, keyed by level.
                 *
                 * The lane and the hover preview deliberately keep separate pools — one is
                 * thumbnails for a strip, the other a large frame for one instant — so a
                 * check that wants to know what a hover *should* show has to look at both.
                 */
                function frameDebug() {
                    const dump = pool => {
                        const out = []
                        for (const [key, entry] of pool) {
                            const [level, t] = key.split(':')
                            out.push({ level: Number(level), t: Number(t), url: entry.url, w: entry.w })
                        }
                        return out
                    }
                    return { hover: dump(hoverCache), thumbs: dump(thumbnailCache) }
                }

                // ------------------------------------------------------- keyframes
                /**
                 * Keyframes are only fetched when they can actually be seen.
                 *
                 * The GOP here is ~2 s, so zoomed out they sit a fraction of a pixel
                 * apart and are pure noise. Worse, asking for them over a wide window
                 * makes ffprobe walk the entire source — on a 6.5 GB six-hour recording
                 * that is a full-file scan, which is both pointless and slow enough to
                 * stall the page. Both limits below exist to prevent that request.
                 */
                const KEYFRAME_MAX_WINDOW = 900.0
                // Fetch threshold is about *snapping* (a little data is enough);
                // the draw threshold is about *legibility*, because a 2 s GOP shown
                // at 3 px spacing is a picket fence, not information.
                const KEYFRAME_FETCH_PX_PER_SECOND = 1.5
                const keyframesUseful = computed(() =>
                    pxPerSecond.value >= KEYFRAME_FETCH_PX_PER_SECOND &&
                    (viewWindow.value.to - viewWindow.value.from) <= KEYFRAME_MAX_WINDOW)
                // Worst case the array holds KEYFRAME_MAX_WINDOW / 2 ticks (450 at a
                // 2 s GOP), which is why one bound is enough.
                const showKeyframeTicks = keyframesUseful

                function scheduleKeyframeLoad() {
                    clearTimeout(kfTimer)
                    kfTimer = setTimeout(loadKeyframes, 320)
                }
                let keyframeRequest = 0
                async function loadKeyframes() {
                    const request = ++keyframeRequest, generation = openGeneration
                    if (!selected.value || !showKeyframes.value || !keyframesUseful.value) {
                        keyframes.value = []
                        return
                    }
                    const { from, to } = viewWindow.value
                    if (to - from <= 0) { keyframes.value = []; return }
                    const key = `${Math.floor(from)}-${Math.ceil(to)}`
                    if (kfCache.has(key)) { keyframes.value = kfCache.get(key); return }
                    try {
                        const r = await fetch(`/api/media/${selected.value.id}/keyframes?from=${from}&to=${to}`)
                        if (generation !== openGeneration || request !== keyframeRequest) return
                        if (!r.ok) { keyframes.value = []; return }
                        const d = await r.json()
                        if (generation !== openGeneration || request !== keyframeRequest) return
                        kfCache.set(key, d.keyframes || [])
                        keyframes.value = d.keyframes || []
                    } catch (e) { if (generation === openGeneration && request === keyframeRequest) keyframes.value = [] }
                }

                // ------------------------------------------------------------ zoom
                function setZoom(next, anchorRatio) {
                    const el = viewport.value
                    const ratio = anchorRatio != null ? anchorRatio
                        : (el ? (el.scrollLeft + el.clientWidth / 2) / Math.max(1, el.scrollWidth) : 0.5)
                    zoom.value = Math.max(1, Math.min(ZOOM_MAX, next))
                    requestAnimationFrame(() => {
                        if (el) el.scrollLeft = ratio * el.scrollWidth - el.clientWidth / 2
                        scheduleKeyframeLoad()
                    })
                }
                function zoomBy(factor, anchorRatio) { setZoom(zoom.value * factor, anchorRatio) }
                function zoomFit() {
                    zoom.value = 1
                    requestAnimationFrame(() => { if (viewport.value) viewport.value.scrollLeft = 0 })
                }
                /** Ctrl/⌘ + wheel zooms at the cursor; Shift = keyframe; Alt = frame. */
                function onWheel(e) {
                    const el = viewport.value
                    if (!el) return
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault()
                        const box = el.getBoundingClientRect()
                        const ratio = (e.clientX - box.left + el.scrollLeft) / Math.max(1, el.scrollWidth)
                        zoomBy(e.deltaY < 0 ? 1.25 : 1 / 1.25, ratio)
                    } else if (e.shiftKey) {
                        e.preventDefault(); pause(); jumpKeyframe(e.deltaY < 0 ? 1 : -1)
                    } else if (e.altKey) {
                        e.preventDefault(); stepFrames(e.deltaY < 0 ? 1 : -1)
                    }
                    // a plain wheel falls through to native scrolling
                }
                function onScroll() {
                    scrollLeft.value = viewport.value?.scrollLeft || 0
                    schedulePersist()
                    scheduleKeyframeLoad()
                }

                // ------------------------------------------------------- shortcuts
                function onKeyDown(e) {
                    const tag = (e.target && e.target.tagName) || ''
                    if (e.isComposing || e.target?.isContentEditable || tag === 'TEXTAREA' || tag === 'SELECT' ||
                        (tag === 'INPUT' && !['button', 'submit', 'reset', 'checkbox', 'radio'].includes(e.target.type))) return
                    if (!detail.value) return
                    const key = e.key
                    const mod = e.ctrlKey || e.metaKey
                    const command = key.toLowerCase()
                    if (mod && ['z', 'y', 's'].includes(command)) {
                        e.preventDefault(); e.stopImmediatePropagation()
                        if (command === 's') return saveProject()
                        return command === 'y' || e.shiftKey ? redoEdit() : undoEdit()
                    }
                    if (mod && !['ArrowLeft', 'ArrowRight'].includes(key)) return
                    if (![' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ',', '<', '.', '>', 'Backspace', 'Delete', 'Escape', '_', '+', 'i', 'o', 'b', 'e', 'j', 'k', 'l'].includes(key.length === 1 ? command : key)) return
                    // Capture before focused buttons/links synthesize a click or scroll.
                    e.preventDefault(); e.stopImmediatePropagation()
                    if (e.repeat && [' ', 'i', 'o', 'b', 'e', '+', 'Delete'].includes(key)) return
                    if (e.altKey && key === 'ArrowLeft') { e.preventDefault(); return jumpKeyframe(-1) }
                    if (e.altKey && key === 'ArrowRight') { e.preventDefault(); return jumpKeyframe(1) }
                    if (e.shiftKey && key === 'ArrowLeft') { e.preventDefault(); return seekToTime(segments.value[activeSeg.value]?.start ?? 0) }
                    if (e.shiftKey && key === 'ArrowRight') { e.preventDefault(); return seekToTime(segments.value[activeSeg.value]?.end ?? duration.value) }
                    switch (key) {
                        case ' ': e.preventDefault(); return togglePlay()
                        case 'ArrowLeft': e.preventDefault(); return stepSeconds(mod ? -10 : -1)
                        case 'ArrowRight': e.preventDefault(); return stepSeconds(mod ? 10 : 1)
                        case ',': case '<': e.preventDefault(); return stepFrames(-1)
                        case '.': case '>': e.preventDefault(); return stepFrames(1)
                        case 'ArrowUp': e.preventDefault(); return jumpSegment(-1)
                        case 'ArrowDown': e.preventDefault(); return jumpSegment(1)
                        case 'i': case 'I': e.preventDefault(); return setSegmentBound('start')
                        case 'o': case 'O': e.preventDefault(); return setSegmentBound('end')
                        case 'Backspace': e.preventDefault(); return clearSegmentEnd()
                        case 'b': case 'B': e.preventDefault(); return splitAtPlayhead()
                        case 'e': case 'E': e.preventDefault(); return exportSegments()
                        case 'j': case 'J': e.preventDefault(); return nudgeRate(-1)
                        case 'k': case 'K': e.preventDefault(); return setRate(1)
                        case 'l': case 'L': e.preventDefault(); return nudgeRate(1)
                        case '_': case '+': e.preventDefault(); return addSegmentAtPlayhead()
                        case 'Delete': e.preventDefault(); return activeSeg.value >= 0 ? removeSegment(activeSeg.value) : null
                        case 'Escape': e.preventDefault(); return cancelDrag()
                        default: return
                    }
                }

                // ------------------------------------------------------------ lanes
                const chatBuckets = computed(() => {
                    const chats = lanes.value?.chats || []
                    if (!chats.length || !duration.value) return []
                    const width = Math.max(200, Math.min(2400, Math.round(contentWidth.value)))
                    const bucket = duration.value / width
                    const counts = new Array(width).fill(0)
                    for (const t of chats) {
                        const i = Math.min(width - 1, Math.max(0, Math.floor(t / bucket)))
                        counts[i]++
                    }
                    const max = Math.max(1, ...counts)
                    const out = []
                    for (let i = 0; i < width; i++) {
                        if (counts[i]) out.push({ t: i * bucket, left: (i / width) * 100, w: 100 / width, h: counts[i] / max })
                    }
                    return out
                })
                const levelBuckets = computed(() => {
                    const segs = lanes.value?.toyLevels || []
                    if (!segs.length || !duration.value) return []
                    const width = Math.max(200, Math.min(2400, Math.round(contentWidth.value)))
                    const bucket = duration.value / width
                    const peaks = new Array(width).fill(0)
                    for (const s of segs) {
                        const from = Math.min(width - 1, Math.max(0, Math.floor(s.start / bucket)))
                        const to = Math.min(width - 1, Math.max(0, Math.floor((s.end - 1e-6) / bucket)))
                        for (let i = from; i <= to; i++) if (s.power > peaks[i]) peaks[i] = s.power
                    }
                    const out = []
                    for (let i = 0; i < width; i++) {
                        if (peaks[i]) out.push({ t: (i * bucket), left: (i / width) * 100, w: 100 / width, power: peaks[i] })
                    }
                    return out
                })
                const giftMarks = computed(() => {
                    const gifts = lanes.value?.gifts || []
                    if (!gifts.length || !duration.value) return []
                    const maxAmount = Math.max(1, ...gifts.map(g => g.amount || 0))
                    const minWidth = Math.max(0.05, Math.min(1.0, 3 / Math.max(pxPerSecond.value, 1e-9) / duration.value * 100))
                    return gifts.map(g => ({
                        t: g.t, left: timeToPct(g.t), w: minWidth,
                        h: 0.2 + 0.8 * Math.log10(1 + (g.amount || 0)) / Math.log10(1 + maxAmount),
                        color: g.source === 'king' ? '#a855f7'
                            : (g.source || '').startsWith('show:') ? '#ec4899'
                            : (g.amount || 0) > 0 ? '#f59e0b' : '#64748b',
                        title: `${tc(g.t)} · ${g.amount || 0} · ${g.source || '-'} · ${g.user || '-'}`
                    }))
                })
                const audioOverviewUrl = computed(() => {
                    if (!showAudio.value || !selected.value) return null
                    return `/api/media/${selected.value.id}/waveform`
                })
                const spectrogramUrl = computed(() => {
                    if (!showSpec.value || !selected.value) return null
                    const { from, to } = viewWindow.value
                    if (to - from < 1) return null
                    return `/api/media/${selected.value.id}/spectrogram?from=${from.toFixed(1)}&to=${to.toFixed(1)}&w=2048&h=256`
                })
                const tableEvents = computed(() => (lanes.value?.events || []).slice(0, 400))

                // ------------------------------------------------------ suggestions
                let suggestionRequest = 0
                async function loadSuggestions() {
                    const request = ++suggestionRequest, generation = openGeneration
                    if (!selected.value || !selected.value.hasEvents) { suggestions.value = []; return }
                    suggestLoading.value = true
                    try {
                        const p = new URLSearchParams({
                            nudge: String(eventOffset.value),
                            preset: prefs.value.preset, mergeGap: String(prefs.value.mergeGap),
                            minBlock: String(prefs.value.minBlock), padBefore: String(prefs.value.padBefore),
                            padAfter: String(prefs.value.padAfter), minScore: String(prefs.value.minScore)
                        })
                        const r = await fetch(`/api/media/${selected.value.id}/suggestions?` + p)
                        const result = r.ok ? await r.json() : []
                        if (generation === openGeneration && request === suggestionRequest) suggestions.value = result
                    } catch (e) { if (generation === openGeneration) message.value = '建议加载失败：' + e.message }
                    finally { if (generation === openGeneration && request === suggestionRequest) suggestLoading.value = false }
                }
                function onPrefsChanged() {
                    clearTimeout(suggestTimer)
                    suggestTimer = setTimeout(loadSuggestions, 320)
                }
                function acceptSuggestion(b, record = true) {
                    const s = newSegment(b.start, b.end, b.reasons?.[0]?.detail || 'suggested')
                    const error = segmentError(s)
                    if (error) { message.value = error; return false }
                    if (record) rememberEdit()
                    segments.value.push(s); sortSegments(); rightTab.value = 'segments'
                    return true
                }
                function acceptAll() {
                    const before = editSnapshot()
                    let accepted = 0
                    const remaining = suggestions.value.filter(b => { if (acceptSuggestion(b, false)) { accepted++; return false } return true })
                    if (accepted) rememberEdit(before)
                    suggestions.value = remaining
                    message.value = '已接受 ' + accepted + ' 个建议，跳过 ' + remaining.length + ' 个冲突建议'
                }
                function addSegmentAtPlayhead() {
                    const pending = segments.value.find(s => s.id === pendingMarkerId.value && s.end == null)
                    if (pending) {
                        if (updateSegment(pending, currentTime.value, null)) { activeSeg.value = segments.value.indexOf(pending); sortSegments() }
                    } else {
                        const marker = newSegment(currentTime.value, null, '')
                        const error = segmentError(marker)
                        if (error) { message.value = error; return }
                        rememberEdit()
                        segments.value.push(marker); activeSeg.value = segments.value.length - 1
                        pendingMarkerId.value = marker.id; sortSegments(); message.value = ''
                    }
                    rightTab.value = 'segments'
                }

                // ----------------------------------------------------------- export
                async function exportSegments() {
                    if (!validateProject()) return
                    const usable = exportable.value
                    if (!usable.length) { message.value = '没有可导出的片段'; return }
                    message.value = '提交导出…'
                    const r = await fetch('/api/export', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            items: [{ mediaId: selected.value.id, segments: usable }],
                            outputDir: outputDir.value || null, snap: 'before'
                        })
                    })
                    const data = await r.json()
                    if (!r.ok) { message.value = data.error || '导出失败'; return }
                    exportJob.value = data
                    rightTab.value = 'export'
                    pollExport(data.id)
                }
                let exportPoll = null
                async function pollExport(id) {
                    clearTimeout(exportPoll)
                    const generation = openGeneration
                    const tick = async () => {
                        try {
                            const r = await fetch('/api/export/' + id)
                            if (!r.ok) return
                            const job = await r.json()
                            if (generation !== openGeneration) return
                            exportJob.value = job
                            if (['RUNNING', 'QUEUED'].includes(job.state)) exportPoll = setTimeout(tick, 1200)
                        } catch { /* The saved job can be reopened after reconnecting. */ }
                    }
                    tick()
                }
                async function loadProject(id = selected.value?.id, generation = openGeneration) {
                    if (!selected.value) return
                    const r = await fetch('/api/media/' + id + '/project')
                    if (!r.ok) return
                    const d = await r.json()
                    if (generation === openGeneration && d.segments && d.segments.length) {
                        segments.value = d.segments.map(s => ({ ...newSegment(s.start, s.end, s.name), ...s }))
                        message.value = '已载入 ' + d.segments.length + ' 个片段'
                    }
                }
                async function saveProject() {
                    if (!selected.value) return
                    if (!validateProject()) return
                    const r = await fetch('/api/media/' + selected.value.id + '/project', {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mediaId: selected.value.id, mediaFileName: selected.value.fileName, segments: segments.value })
                    })
                    message.value = r.ok ? '项目已保存到输出目录' : '保存失败'
                }
                function validateProject() {
                    for (const s of segments.value) {
                        const error = segmentError(s, [s])
                        if (error) { message.value = error; return false }
                    }
                    return true
                }

                // ---------------------------------------------------------- player
                function attachPlayer() {
                    const el = player.value
                    if (!el || !selected.value) return
                    const target = currentTime.value
                    detachPlayer()
                    pendingSeek = target
                    seeking.value = true
                    // Lossless mode: hand the browser the source file itself and let it
                    // range-request. No transcode and no quality loss, at the cost of
                    // full source bitrate on the wire.
                    if (quality.value === PROXY_QUALITY) {
                        el.src = `/api/media/${selected.value.id}/proxy.mp4?h=${proxyHeight.value}&f=${proxyFps.value}`
                        playerState.value = `本地代理 ${proxyHeight.value}p（浏览器解码）`
                        return
                    }
                    if (quality.value === RAW_QUALITY) {
                        // Works, but the recording is not faststart: expect a long stall
                        // while the browser fetches the trailing index.
                        el.src = `/api/media/${selected.value.id}/raw`
                        playerState.value = '无损直取（源文件，索引在尾部，首次较慢）'
                        return
                    }
                    if (el.canPlayType('application/vnd.apple.mpegurl') && !window.Hls) {
                        el.src = `/api/media/${selected.value.id}/preview.m3u8?q=${quality.value}`
                        playerState.value = 'native HLS'
                        return
                    }
                    if (!window.Hls || !window.Hls.isSupported()) {
                        playerState.value = '浏览器不支持 HLS 预览'
                        return
                    }
                    const instance = new window.Hls({
                        maxBufferLength: 20, maxMaxBufferLength: 40, backBufferLength: 30,
                        enableWorker: true, autoStartLoad: false, startPosition: target
                    })
                    instance.on(window.Hls.Events.MANIFEST_PARSED, () => instance.startLoad(pendingSeek ?? target))
                    instance.on(window.Hls.Events.FRAG_BUFFERED, refreshBuffered)
                    instance.loadSource(`/api/media/${selected.value.id}/preview.m3u8?q=${quality.value}`)
                    instance.attachMedia(el)
                    instance.on(window.Hls.Events.ERROR, (_, data) => { if (data && data.fatal) playerState.value = '预览错误: ' + data.details })
                    hls = instance
                    playerState.value = '低清预览 (' + quality.value + ')'
                }
                function detachPlayer() {
                    clearTimeout(scrubSeekTimer); scrubSeekTimer = null
                    drag.value = null
                    pendingSeek = null
                    seeking.value = false
                    buffering.value = false
                    // The player is being emptied, so nothing is playing any more.
                    //
                    // This has to be cleared by hand: dropping `src` (or `hls.destroy()`)
                    // does not fire a `pause` event, so `onPaused` never runs and the flag
                    // keeps whatever the *previous* file left behind. Switching files while
                    // playing then left the transport showing "pause" for a video that was
                    // sitting still, and the next space press called `pause()` on an
                    // already-paused element — so it took two presses to start playing.
                    playing.value = false
                    clearScrubFrame()
                    buffered.value = []
                    if (hls) { try { hls.destroy() } catch (e) { /* already gone */ } hls = null }
                    const el = player.value
                    if (el) { el.removeAttribute('src'); try { el.load() } catch (e) { /* ignore */ } }
                }
                function setQuality(qy) {
                    const resume = player.value && !player.value.paused
                    quality.value = qy
                    if (selected.value) attachPlayer()
                    if (resume) play()
                }
                /**
                 * The video element only becomes authoritative once a seek settles.
                 *
                 * While hls.js is fetching the fragment for a far seek, `video.currentTime`
                 * still reports the *old* position — often 0 — so feeding it straight
                 * into the playhead made it snap back to the start the moment a drag
                 * ended. Only arrival at the requested target releases the playhead.
                 */
                function onTimeUpdate() {
                    const el = player.value
                    if (!el || drag.value || seeking.value) return
                    currentTime.value = el.currentTime
                }
                const onPlaying = () => { playing.value = true }
                const onPaused = () => { playing.value = false }
                function onCanPlay() { buffering.value = false; onSeeked() }
                function onMetadata() {
                    if (player.value) player.value.playbackRate = rate.value
                    applyPendingSeek()
                    refreshBuffered()
                }

                /**
                 * The browser's own cache: ranges it can play with no new request.
                 * Drawn on the timeline so the client-side caching is visible.
                 */
                function refreshBuffered() {
                    const el = player.value
                    if (!el || !el.buffered) { buffered.value = []; return }
                    const out = []
                    for (let i = 0; i < el.buffered.length; i++) {
                        out.push([el.buffered.start(i), el.buffered.end(i)])
                    }
                    if (JSON.stringify(buffered.value) !== JSON.stringify(out)) buffered.value = out
                    onSeeked()
                }
                const bufferedMarks = computed(() =>
                    buffered.value
                        .filter(([a, b]) => b > a)
                        .map(([a, b]) => ({ left: timeToPct(a), width: widthToPct(a, b) })))

                /**
                 * Every event-derived layer is recomputed from the shifted events, so a
                 * change re-fetches the lanes and the suggestions. The player, the
                 * keyframes, the buffered bar and the cached-frame marks are properties
                 * of the *media*, not of the events, and deliberately do not move.
                 */
                let offsetTimer = null
                function reloadEventLayers() {
                    if (!selected.value || !selected.value.hasEvents) return
                    clearTimeout(offsetTimer)
                    offsetTimer = setTimeout(async () => {
                        const id = selected.value.id
                        lanesLoading.value = true
                        try {
                            const r = await fetch(`/api/media/${id}/lanes?nudge=${eventOffset.value}`)
                            if (selected.value && selected.value.id === id) lanes.value = r.ok ? await r.json() : null
                        } finally { lanesLoading.value = false }
                        if (selected.value && selected.value.id === id) await loadSuggestions()
                    }, 250)
                }
                function setEventOffset(seconds) {
                    const v = Math.max(EVENT_OFFSET_MIN, Math.min(EVENT_OFFSET_MAX, Number(seconds) || 0))
                    eventOffset.value = Math.round(v * 10) / 10
                    reloadEventLayers()
                }
                function resetEventOffset() { setEventOffset(DEFAULT_EVENT_OFFSET) }
                /** True while the lane offset is the calibrated default (so the control reads "normal"). */
                const isDefaultOffset = computed(() => Math.abs(eventOffset.value - DEFAULT_EVENT_OFFSET) < 1e-9)

                // ------------------------------------------------------ proxy mode
                async function refreshProxy() {
                    if (!selected.value) return
                    const generation = openGeneration, height = proxyHeight.value, frames = proxyFps.value
                    try {
                        const r = await fetch(`/api/media/${selected.value.id}/proxy?h=${proxyHeight.value}&f=${proxyFps.value}`)
                        if (r.ok) {
                            const value = await r.json()
                            if (generation === openGeneration && height === proxyHeight.value && frames === proxyFps.value) proxy.value = value
                        }
                    } catch (e) { /* transient */ }
                }
                async function buildProxy() {
                    if (!selected.value) return
                    const r = await fetch(`/api/media/${selected.value.id}/proxy?h=${proxyHeight.value}&f=${proxyFps.value}`, { method: 'POST' })
                    if (r.ok) proxy.value = await r.json()
                    clearInterval(proxyPoll)
                    proxyPoll = setInterval(async () => {
                        await refreshProxy()
                        if (proxy.value && proxy.value.status !== 'RUNNING') {
                            clearInterval(proxyPoll)
                            if (proxy.value.status === 'READY' && quality.value === PROXY_QUALITY) attachPlayer()
                        }
                    }, 2000)
                }
                async function deleteProxy(all = false) {
                    if (!selected.value) return
                    const q = all ? '' : `?h=${proxyHeight.value}&f=${proxyFps.value}`
                    await fetch(`/api/media/${selected.value.id}/proxy${q}`, { method: 'DELETE' })
                    await refreshProxy()
                }
                function reproxyIfPlaying() {
                    refreshProxy().then(() => {
                        if (quality.value === PROXY_QUALITY) setQuality(PROXY_QUALITY)
                    })
                }
                function setProxyHeight(h) { proxyHeight.value = h; reproxyIfPlaying() }
                function setProxyFps(f) { proxyFps.value = f; reproxyIfPlaying() }

                // --------------------------------------------------------- library
                async function loadHealth() {
                    try { health.value = await (await fetch('/api/health')).json() } catch (e) { health.value = null }
                }
                /**
                 * Loads one page of the library.
                 *
                 * `append` extends the list for infinite scroll; otherwise the page
                 * replaces it. A generation counter is checked after the await because the
                 * filter can change while a page is in flight, and a late response must not
                 * overwrite the newer result.
                 */
                async function loadLibrary(append = false) {
                    const generation = ++libraryGeneration
                    if (append) libraryLoadingMore.value = true; else loading.value = true
                    try {
                        const offset = append ? libraryOffset.value : 0
                        const p = new URLSearchParams({
                            sort: sort.value, limit: String(LIBRARY_PAGE), offset: String(offset)
                        })
                        if (q.value.trim()) p.set('q', q.value.trim())
                        if (roomFilter.value) p.set('room', roomFilter.value)
                        if (eventsOnly.value) p.set('hasEvents', 'true')
                        const r = await (await fetch('/api/library?' + p)).json()
                        if (generation !== libraryGeneration) return
                        const page = r.items || []
                        if (!append) {
                            // The list was replaced, so every index now points somewhere else.
                            anchorIndex = -1
                        }
                        items.value = append ? items.value.concat(page) : page
                        libraryOffset.value = items.value.length
                        total.value = r.total || 0
                        libraryDone.value = items.value.length >= total.value || page.length === 0
                        rooms.value = r.rooms || []
                    } finally {
                        if (generation === libraryGeneration) {
                            loading.value = false
                            libraryLoadingMore.value = false
                        }
                    }
                }

                /** Re-reads the list from page 1 (filter or sort changed, or after a rescan). */
                async function reloadLibrary() {
                    libraryOffset.value = 0
                    libraryDone.value = false
                    // Filter/sort changed: ids stay but their positions do not, so a stale
                    // anchor would extend the range across unrelated recordings.
                    clearChecked()
                    await loadLibrary(false)
                }

                /** Infinite scroll: pulls the next page when the list nears its end. */
                function onLibraryScroll(e) {
                    if (libraryDone.value || loading.value || libraryLoadingMore.value) return
                    const el = e.target
                    if (el.scrollHeight - el.scrollTop - el.clientHeight < 600) loadLibrary(true)
                }
                async function loadConfig() {
                    try {
                        const c = await (await fetch('/api/config')).json()
                        deleteEnabled.value = !!c.deleteEnabled
                        deleteBlockedReason.value = c.deleteBlockedReason || ''
                    } catch (e) { deleteEnabled.value = false }
                }

                async function loadSettings() {
                    try {
                        settings.value = await (await fetch('/api/settings')).json()
                    } catch (e) { /* keep the last known value */ }
                }

                async function setDeleteAfterExport(value) {
                    savingSettings.value = true
                    try {
                        const r = await fetch('/api/settings', {
                            method: 'PUT', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ deleteSourceAfterExport: value })
                        })
                        if (r.ok) settings.value = await r.json()
                    } finally { savingSettings.value = false }
                }

                /** Total bytes of a pending selection, for the confirmation copy. */
                function pendingBytes(list) {
                    return (list || []).reduce((n, it) => n + (it.sizeBytes || 0), 0)
                }

                /**
                 * Selection anchor: the row a shift-range extends from.
                 *
                 * Held as an index rather than an id so a range is a slice of the list the
                 * user is actually looking at. It is reset whenever the list is replaced —
                 * after a filter change or a delete the old index points at a different
                 * recording, and extending from it would select an arbitrary run.
                 */
                let anchorIndex = -1

                /** The current selection as a Set of ids, in list order. */
                function checkedItems() { return items.value.filter(it => checked.value.has(it.id)) }

                function clearChecked() {
                    checked.value = new Set()
                    anchorIndex = -1
                }

                function toggleCheckAll() {
                    if (checked.value.size === items.value.length) {
                        clearChecked()
                    } else {
                        checked.value = new Set(items.value.map(it => it.id))
                        // No anchor: the whole list is selected, so there is no meaningful
                        // row for a later shift-click to extend from.
                        anchorIndex = -1
                    }
                }

                /** Selects the inclusive run between the anchor and [index]. */
                function selectRange(index) {
                    if (anchorIndex < 0 || anchorIndex >= items.value.length) {
                        anchorIndex = index
                        checked.value = new Set([items.value[index].id])
                        return
                    }
                    const from = Math.min(anchorIndex, index)
                    const to = Math.max(anchorIndex, index)
                    checked.value = new Set(items.value.slice(from, to + 1).map(it => it.id))
                }

                /**
                 * Checkbox click. Shift extends a range from the anchor, Cmd/Ctrl toggles one
                 * row, and a plain click selects only that row and becomes the new anchor —
                 * the behaviour every file manager trains people to expect.
                 */
                function toggleChecked(index, event) {
                    if (event && event.shiftKey) { selectRange(index); return }
                    const id = items.value[index].id
                    if (event && (event.metaKey || event.ctrlKey)) {
                        const next = new Set(checked.value)
                        if (next.has(id)) next.delete(id); else next.add(id)
                        checked.value = next
                    } else {
                        checked.value = new Set([id])
                    }
                    anchorIndex = index
                }

                /**
                 * Click on a library row.
                 *
                 * Shift/Cmd/Ctrl turn the click into a selection gesture instead of an open,
                 * so a range can be picked without aiming at the small checkbox. A plain
                 * click still opens the recording — that is the primary action here and
                 * changing it would break the existing flow.
                 */
                function onRowClick(index, event) {
                    if (event.shiftKey || event.metaKey || event.ctrlKey) {
                        event.preventDefault()
                        toggleChecked(index, event)
                        return
                    }
                    open(items.value[index])
                }

                /** Opens the confirmation for either one recording or the current selection. */
                function askDelete(list) {
                    const targets = (Array.isArray(list) ? list : [list]).filter(Boolean)
                    if (!targets.length) return
                    deleteError.value = ''
                    deletePrompt.value = { items: targets }
                }

                async function confirmDelete() {
                    const targets = deletePrompt.value ? deletePrompt.value.items : []
                    if (!targets.length) return
                    deleting.value = true
                    deleteError.value = ''
                    const gone = new Set()
                    const failures = []
                    for (const it of targets) {
                        try {
                            const r = await fetch('/api/media/' + it.id, { method: 'DELETE' })
                            if (r.ok) { gone.add(it.id); continue }
                            const body = await r.json().catch(() => null)
                            failures.push(it.fileName + ': ' + ((body && (body.detail || body.error)) || ('HTTP ' + r.status)))
                        } catch (e) {
                            failures.push(it.fileName + ': ' + e.message)
                        }
                    }
                    deleting.value = false
                    // Drop the rows the server confirmed gone, whatever else failed.
                    const removedHere = items.value.filter(it => gone.has(it.id)).length
                    items.value = items.value.filter(it => !gone.has(it.id))
                    const next = new Set(checked.value)
                    gone.forEach(id => next.delete(id))
                    checked.value = next
                    // Row indices shifted, so an anchor from before the delete now points at
                    // a different recording; drop it rather than extend from the wrong place.
                    anchorIndex = -1
                    total.value = Math.max(0, total.value - gone.size)
                    // Deleting shifts every later row one position earlier on the server, so
                    // the loaded window must shrink with it. Without this, the next "load
                    // more" would start at the old offset and silently skip one recording.
                    libraryOffset.value = Math.max(0, libraryOffset.value - removedHere)
                    // A deleted recording must not stay open behind the dialog.
                    if (selected.value && gone.has(selected.value.id)) closeEditor()
                    if (failures.length) {
                        // Keep the dialog open so the reason stays readable and the failed
                        // rows are still visible in the list behind it.
                        deleteError.value = failures.join('\n')
                        deletePrompt.value = { items: targets.filter(it => !gone.has(it.id)) }
                        if (!deletePrompt.value.items.length) deletePrompt.value = null
                    } else {
                        deletePrompt.value = null
                        deleteError.value = ''
                    }
                }

                async function rescan() {
                    scanning.value = true
                    const gen = health.value ? health.value.generation : 0
                    await fetch('/api/library/scan', { method: 'POST' })
                    const started = Date.now()
                    while (Date.now() - started < 600000) {
                        await new Promise(r => setTimeout(r, 1500))
                        await loadHealth()
                        if (health.value && health.value.generation !== gen && !health.value.scanning) break
                    }
                    scanning.value = false
                    await loadConfig()
                    await loadSettings()
                    await reloadLibrary()
                }
                const editorLoading = ref(false)

                function preferencesSnapshot() {
                    return { layout: layout.value, laneHeights: laneHeights.value, laneFlags: laneFlags.value,
                        showThumbnails: showThumbnails.value, showAudio: showAudio.value, showSpec: showSpec.value,
                        showKeyframes: showKeyframes.value, snap: snap.value, q: q.value, sort: sort.value,
                        roomFilter: roomFilter.value, eventsOnly: eventsOnly.value, prefs: prefs.value,
                        edited: edited.value, lastId: selected.value?.id }
                }
                /**
                 * Writes the draft.
                 *
                 * The pending edit decides what this write means. Layout, scroll, zoom and
                 * playback state save on their own schedule — dozens of times while a
                 * segment sits half-trimmed — and treating every write as "the draft is
                 * safe now" would clear the exit warning before the edit it warns about had
                 * been written. So a write only counts as flushing the edits when one is
                 * actually pending; otherwise it saves the view state and leaves the
                 * warning standing.
                 */
                function persistEditor() {
                    clearTimeout(persistTimer); persistTimer = null
                    if (restoring) return
                    const flushesEdits = edited.value
                    try {
                        localStorage.setItem('xhcut:preferences:v1', JSON.stringify(preferencesSnapshot()))
                        if (selected.value && detail.value) {
                            localStorage.setItem('xhcut:editor:v1:' + selected.value.id, JSON.stringify({
                                segments: segments.value, active: activeSeg.value, pending: pendingMarkerId.value,
                                time: currentTime.value, zoom: zoom.value, scroll: viewport.value?.scrollLeft ?? scrollLeft.value,
                                scrollTop: viewport.value?.scrollTop || 0,
                                tab: rightTab.value, rate: rate.value, quality: quality.value, eventOffset: eventOffset.value,
                                proxyHeight: proxyHeight.value, proxyFps: proxyFps.value, outputDir: outputDir.value,
                                exportJobId: exportJob.value?.id, undo: undoStack.value.slice(-20), redo: redoStack.value.slice(-20)
                            }))
                        }
                        storageNotice.value = ''
                        if (flushesEdits) clearEditsDirty()
                    } catch {
                        // A failed write must not clear the flag: the warning is now the
                        // only thing standing between the user and silent data loss.
                        storageNotice.value = '浏览器无法保存编辑状态，请使用「保存 .llc」备份'
                    }
                }
                function schedulePersist() {
                    if (restoring || persistTimer) return
                    persistTimer = setTimeout(persistEditor, PERSIST_DELAY_MS)
                }
                function restorePreferences() {
                    const saved = readStored('xhcut:preferences:v1')
                    if (!saved) return
                    for (const [key, value] of Object.entries(saved.layout || {})) {
                        if (key in layout.value && Number.isFinite(value)) layout.value[key] = clamp(value, 70, 600)
                    }
                    for (const [key, value] of Object.entries(saved.laneHeights || {})) {
                        if (key in laneHeights.value && Number.isFinite(value)) laneHeights.value[key] = clamp(value, 20, 240)
                    }
                    for (const key of Object.keys(laneFlags.value)) if (typeof saved.laneFlags?.[key] === 'boolean') laneFlags.value[key] = saved.laneFlags[key]
                    for (const [key, target] of Object.entries({ showThumbnails, showAudio, showSpec, showKeyframes, snap, eventsOnly })) {
                        if (typeof saved[key] === 'boolean') target.value = saved[key]
                    }
                    q.value = typeof saved.q === 'string' ? saved.q : ''
                    roomFilter.value = typeof saved.roomFilter === 'string' ? saved.roomFilter : ''
                    if (['heat', 'date', 'size', 'duration'].includes(saved.sort)) sort.value = saved.sort
                    if (saved.prefs) for (const key of Object.keys(prefs.value)) {
                        if (typeof saved.prefs[key] === typeof prefs.value[key]) prefs.value[key] = saved.prefs[key]
                    }
                    // An edit that was pending when the tab went away is still pending on
                    // the way back in: the draft on disk is the older one, and the warning
                    // has to survive the reload that raised it.
                    if (saved.edited === true) markEditsDirty()
                }
                function restoreDraft(saved) {
                    if (!saved) return
                    if (Array.isArray(saved.segments)) segments.value = saved.segments.filter(s => s && Number.isFinite(s.start) && (s.end == null || Number.isFinite(s.end))).map(s => ({ ...newSegment(s.start, s.end, s.name), ...s }))
                    activeSeg.value = Number.isInteger(saved.active) ? clamp(saved.active, -1, segments.value.length - 1) : -1
                    pendingMarkerId.value = segments.value.some(s => s.id === saved.pending && s.end == null) ? saved.pending : null
                    currentTime.value = Number.isFinite(saved.time) ? clamp(saved.time, 0, duration.value) : 0
                    zoom.value = Number.isFinite(saved.zoom) ? clamp(saved.zoom, 1, ZOOM_MAX) : 1
                    rightTab.value = ['suggest', 'segments', 'export'].includes(saved.tab) ? saved.tab : 'segments'
                    if (QUALITY_ORDER.includes(saved.quality)) quality.value = saved.quality
                    if (PROXY_HEIGHTS.includes(saved.proxyHeight)) proxyHeight.value = saved.proxyHeight
                    if (PROXY_FPS.some(f => f[0] === saved.proxyFps)) proxyFps.value = saved.proxyFps
                    if (Number.isFinite(saved.rate)) rate.value = clamp(saved.rate, 0.1, 16)
                    eventOffset.value = Number.isFinite(saved.eventOffset)
                        ? Math.round(clamp(saved.eventOffset, EVENT_OFFSET_MIN, EVENT_OFFSET_MAX) * 10) / 10
                        : DEFAULT_EVENT_OFFSET
                    outputDir.value = typeof saved.outputDir === 'string' ? saved.outputDir : ''
                    undoStack.value = Array.isArray(saved.undo) ? saved.undo.filter(s => typeof s === 'string').slice(-20) : []
                    redoStack.value = Array.isArray(saved.redo) ? saved.redo.filter(s => typeof s === 'string').slice(-20) : []
                    if (saved.exportJobId) pollExport(saved.exportJobId)
                }
                /**
                 * Returns the editor to its empty state after the open recording was deleted.
                 *
                 * `openGeneration` is bumped first: an `open()` for this very recording may
                 * still be awaiting `/api/media/{id}`, and without the bump its continuation
                 * would repopulate `detail`/`lanes` for a file that no longer exists.
                 */
                function closeEditor() {
                    openGeneration++
                    persistEditor()
                    clearTimeout(exportPoll)
                    detachPlayer(); stopThumbnails()
                    clearThumbnailCaches()
                    closeHoverPreview()
                    for (const url of frameCache.values()) URL.revokeObjectURL(url)
                    frameCache.clear(); frameRevision.value++
                    clearInterval(proxyPoll)
                    selected.value = null; detail.value = null; lanes.value = null
                    segments.value = []; suggestions.value = []; exportJob.value = null
                    activeSeg.value = -1; pendingMarkerId.value = null; currentTime.value = 0
                    keyframes.value = []; kfCache.clear(); serverCachedTimes.value = []
                    buffered.value = []; proxy.value = null; scrubFrameUrl.value = null
                    undoStack.value = []; redoStack.value = []
                    // Drop ?id= so a reload does not try to reopen the deleted recording.
                    const url = new URL(location.href)
                    url.searchParams.delete('id'); url.searchParams.delete('at'); url.searchParams.delete('zoom')
                    history.replaceState(null, '', url)
                }

                async function open(item) {
                    persistEditor()
                    const generation = ++openGeneration
                    clearTimeout(exportPoll)
                    restoring = true; editorLoading.value = true
                    detachPlayer(); stopThumbnails()
                    clearThumbnailCaches()
                    closeHoverPreview()
                    selected.value = item
                    detail.value = null; lanes.value = null; lanesLoading.value = false
                    segments.value = []; suggestions.value = []; exportJob.value = null
                    activeSeg.value = -1; pendingMarkerId.value = null; currentTime.value = 0
                    undoStack.value = []; redoStack.value = []
                    keyframes.value = []; kfCache.clear()
                    for (const url of frameCache.values()) URL.revokeObjectURL(url)
                    frameCache.clear(); frameRevision.value++
                    serverCachedTimes.value = []
                    buffered.value = []; proxy.value = null; clearInterval(proxyPoll)
                    eventOffset.value = DEFAULT_EVENT_OFFSET
                    scrubFrameUrl.value = null; seeking.value = false
                    zoom.value = 1; scrollLeft.value = 0; message.value = ''
                    const saved = readStored('xhcut:editor:v1:' + item.id)
                    try {
                        const r = await fetch('/api/media/' + item.id)
                        if (!r.ok) throw new Error('录像无法打开 (' + r.status + ')')
                        const data = await r.json()
                        if (generation !== openGeneration) return
                        detail.value = data
                        if (saved && Array.isArray(saved.segments)) restoreDraft(saved)
                        else await loadProject(item.id, generation)
                        if (generation !== openGeneration) return
                        await nextTick()
                        observeViewport()
                        // The CSS runtime and ResizeObserver need a layout frame before
                        // the new scroll container accepts a nonzero scroll offset.
                        await new Promise(requestAnimationFrame)
                        if (generation !== openGeneration) return
                        if (viewport.value) {
                            viewport.value.scrollLeft = Number.isFinite(saved?.scroll) ? saved.scroll : 0
                            viewport.value.scrollTop = Number.isFinite(saved?.scrollTop) ? saved.scrollTop : 0
                        }
                        onScroll()
                        attachPlayer()
                        const url = new URL(location.href)
                        url.searchParams.set('id', item.id); url.searchParams.delete('at'); url.searchParams.delete('zoom')
                        history.replaceState(null, '', url)
                        restoring = false; editorLoading.value = false
                        persistEditor()
                        if (item.hasEvents) {
                            lanesLoading.value = true
                            fetch('/api/media/' + item.id + '/lanes?nudge=' + eventOffset.value).then(r => r.ok ? r.json() : null).then(data => {
                                if (generation === openGeneration) lanes.value = data
                            }).catch(() => {}).finally(() => { if (generation === openGeneration) lanesLoading.value = false })
                        }
                        await Promise.all([loadSuggestions(), loadKeyframes(), loadCachedFrameIndex(), refreshProxy()])
                        scheduleThumbnails()
                    } catch (e) {
                        if (generation === openGeneration) message.value = e.message
                    } finally {
                        if (generation === openGeneration) { restoring = false; editorLoading.value = false }
                    }
                }

                // ----------------------------------------------------------- wire
                let searchTimer = null
                watch([q, sort, roomFilter, eventsOnly], () => {
                    // Any filter change invalidates the accumulated pages, so the list
                    // restarts from the top rather than appending to a stale selection.
                    clearTimeout(searchTimer); searchTimer = setTimeout(reloadLibrary, 250)
                })
                watch([zoom, showKeyframes], () => scheduleKeyframeLoad())
                // Re-fire when the gate *becomes* satisfiable.
                //
                // Keyframes are gated on pixels-per-second, which depends on the
                // measured viewport width. That width is not known until the timeline
                // exists and a ResizeObserver reports, so the first load — the one
                // `open()` kicks off at zoom 1 — always bails, and a plain
                // zoom/scroll watcher can miss the moment the requirement is finally
                // met. Watching the gate itself closes that hole.
                watch(keyframesUseful, (usable) => { if (usable) scheduleKeyframeLoad() })

                // One schedule, two meanings. An edit stays pending until a write that
                // followed it lands, which is what the exit warning tracks; the view state
                // around it saves on its own and must not clear that warning as a side
                // effect. A single debounce serves both, so the write decides what it is
                // from whether the edit flag is up when it fires — scheduling the flush
                // from the edit itself rather than from a watcher, because a segment is
                // edited in place and a deep watcher cannot tell that from a re-render.
                watch(
