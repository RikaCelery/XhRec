                    [eventOffset, prefs, activeSeg, pendingMarkerId, layout, laneHeights, rightTab, quality, rate,
                        proxyHeight, proxyFps, outputDir, laneFlags, showThumbnails, showAudio, showSpec, snap, showKeyframes,
                        q, sort, roomFilter, eventsOnly],
                    schedulePersist,
                    { deep: true, flush: 'post' }
                )
                watch([currentTime, zoom, scrollLeft], schedulePersist)
                watch(() => thumbnailCells.value.map(c => c.level + ':' + c.t).join(','), scheduleThumbnails)
                watch([seeking, buffering], () => {
                    if (!seeking.value && !buffering.value) scheduleThumbnails()
                })
                // The lane's contents follow the scroll, and the popup is anchored to a
                // time — so both have to be recomputed when the window moves under a
                // stationary cursor, not only when the cursor moves.
                // The popup is anchored to the lane's current box, and the lane moves under
                // a stationary cursor when the window scrolls *or* the zoom changes — so both
                // have to re-derive the hovered cell, or the popup follows the timeline
                // instead of the pointer.
                watch([scrollLeft, zoom], () => { if (hoverPreviewEnabled) updateHoverCell(lastPointer) })
                watch(showThumbnails, (on) => {
                    if (!on) closeHoverPreview()
                    else scheduleThumbnails()
                })
                watch(thumbnailTarget, scheduleThumbnails)
                // Dragging the lane taller crosses a rung of the width ladder, and at that
                // moment the pool holds frames cut for the old height: the lane keeps
                // drawing them — a soft picture beats a hole — but the plan has to ask
                // again at the new width, and the sweep the server is running is a sweep of
                // the old one. In-flight frames are dropped with it, so a response cut for
                // the shorter lane cannot land on top of the sharper one.
                watch(thumbLaneWidth, () => {
                    stopThumbnails()
                    scheduleThumbnails()
                })

                onMounted(async () => {
                    history.scrollRestoration = 'manual'
                    window.addEventListener('pagehide', persistEditor)
                    // The tab is going away with unsaved edits: write them on the way out.
                    // `persistEditor` also records why the draft is worth saving at all.
                    document.addEventListener('visibilitychange', () => { if (document.hidden) persistEditor() })
                    setInterval(refreshBuffered, 250)
                    window.addEventListener('pointermove', onPointerMove)
                    window.addEventListener('pointerup', endDrag)
                    window.addEventListener('pointercancel', endDrag)
                    window.addEventListener('blur', endDrag)
                    window.addEventListener('keydown', onKeyDown, true)
                    window.addEventListener('keyup', e => {
                        if (e.code === 'Space' && detail.value && !e.target?.isContentEditable && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target?.tagName)) {
                            e.preventDefault(); e.stopImmediatePropagation()
                        }
                    }, true)
                    const initialParams = new URLSearchParams(location.search)
                    restorePreferences()
                    await loadHealth()
                    await loadConfig()
                    await loadSettings()
                    await reloadLibrary()
                    setInterval(loadHealth, 10000)
                    restoring = false
                    const params = initialParams
                    const wanted = params.get('id') || readStored('xhcut:preferences:v1')?.lastId
                    if (wanted) {
                        const hit = items.value.find(i => i.id === wanted)
                        if (hit) await open(hit)
                        else {
                            const r = await fetch('/api/media/' + wanted)
                            if (r.ok) {
                                const d = await r.json()
                                await open({ id: d.id, fileName: d.fileName, relPath: d.relPath, hasEvents: !!d.hasEvents, durationSeconds: d.durationSeconds })
                            }
                        }
                        // Deep links: ?at=<seconds> parks the playhead, &zoom=<n> opens
                        // at that magnification — handy for sharing a moment.
                        const at = parseFloat(params.get('at') || '')
                        if (isFinite(at)) { await nextTick(); seekToTime(at, { center: true }) }
                        const z = parseFloat(params.get('zoom') || '')
                        if (isFinite(z) && z > 1) { setZoom(z); setTimeout(() => centerOn(isFinite(at) ? at : 0), 60) }
                    }
                })

                return {
                    layout, laneHeights, showThumbnails, thumbnailCells, thumbnailUrl, beginResize, editorLoading, storageNotice,
                    hoverPreviewOpen, hoverPreview, hoverTimecode, hoverStyle, hoverMarkLeft, onLaneHover, closeHoverPreview,
                    thumbnailProgress, thumbnailLevel, thumbnailTarget, thumbnailPlan, showCellTime, edited, frameDebug,
                    persistDelay,
                    deleteEnabled, deleteBlockedReason, checked, deletePrompt, deleting, deleteError,
                    settings, savingSettings, loadSettings, setDeleteAfterExport,
                    loadConfig, pendingBytes, toggleChecked, clearChecked, checkedItems, toggleCheckAll,
                    askDelete, confirmDelete, closeEditor, onRowClick,
                    LIBRARY_PAGE, libraryOffset, libraryDone, libraryLoadingMore,
                    loadLibrary, reloadLibrary, onLibraryScroll,
                    eventOffset, EVENT_OFFSET_MIN, EVENT_OFFSET_MAX, DEFAULT_EVENT_OFFSET,
                    isDefaultOffset, setEventOffset, resetEventOffset,
                    mergeCandidates, mergeSegments, undoStack, redoStack, undoEdit, redoEdit, editSegmentInput,
                    health, items, rooms, total, loading, scanning, selected, detail, lanes, lanesLoading,
                    q, sort, roomFilter, eventsOnly,
                    player, playerState, quality, setQuality, onTimeUpdate, onPlaying, onPaused, onCanPlay, onMetadata, buffering, showAudio, showSpec,
                    segments, suggestions, suggestLoading, prefs, rightTab, activeSeg, exportJob, outputDir, message,
                    loadSuggestions, onPrefsChanged, acceptSuggestion, acceptAll, addSegmentAtPlayhead,
                    setSegmentBound, clearSegmentEnd, splitAtPlayhead, removeSegment, exportSegments, saveProject, exportable,
                    viewport, track, zoom, currentTime, playing, rate, snap, showKeyframes, keyframes, laneFlags,
                    fps, duration, viewWindow, timeToPct, widthToPct, rulerTicks, chatBuckets, levelBuckets, giftMarks, keyframesUseful, showKeyframeTicks, cachedMarks, viewportWidth, pxPerSecond,
                    audioOverviewUrl, spectrogramUrl, tableEvents,
                    seekToTime, centerOn, stepFrames, stepSeconds, jumpKeyframe, jumpSegment,
                    togglePlay, setRate, nudgeRate, setZoom, zoomBy, zoomFit, onWheel, onScroll,
                    beginScrub, beginClipDrag, onSeeked, cancelDrag, scrubFrameUrl, seeking, open, rescan,
                    proxy, bufferedMarks, buildProxy, deleteProxy, refreshBuffered,
                    PROXY_HEIGHTS, proxyHeight, setProxyHeight, PROXY_FPS, proxyFps, setProxyFps,
                    QUALITY_ORDER, qualityLabel, RAW_QUALITY,
                    fmtDur, fmtSize, fmtDate, tc, POWER_LABEL, POWER_COLOR, CONF_LABEL, CONF_COLOR
                }
            },

            template: `
            <header class="flex items-center gap-3 px-4 py-2 border-b border-gray-800 bg-[#12151a] shrink-0">
                <div class="font-semibold tracking-wide text-lg">XhCut</div>
                <div class="text-xs text-gray-500 mono">{{ health ? health.version : '...' }}</div>
                <div v-if="health" class="text-xs text-gray-400">
                    <span class="text-gray-500">indexed</span> {{ health.indexed }}
                    <span v-if="health.lastScanMillis" class="text-gray-600 mono">{{ (health.lastScanMillis/1000).toFixed(1) }}s</span>
                </div>
                <div class="flex-1"></div>
                <div v-if="health" class="text-xs mono" :class="health.scanning ? 'text-amber-400' : 'text-emerald-500'">
                    {{ health.scanning ? '扫描中…' : 'idle' }}
                </div>
                <button @click="rescan" :disabled="scanning"
                        class="text-xs px-3 py-1 rounded border border-gray-700 hover:bg-gray-800 disabled:opacity-50">
                    {{ scanning ? '扫描中…' : '重新扫描' }}
                </button>
            </header>

            <div v-if="storageNotice" role="status" class="px-3 py-1 text-xs text-amber-300">{{ storageNotice }}</div>

            <!-- Permanent-delete confirmation. Deleting cannot be undone, so the dialog
                 names every file, totals the bytes, and makes the confirm a deliberate
                 click rather than a keyboard reflex. -->
            <div v-if="deletePrompt" class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-6"
                 @click.self="deleting ? null : (deletePrompt = null)">
                <div class="bg-[#12151a] border border-rose-900 rounded-lg shadow-2xl w-full max-w-lg flex flex-col max-h-[80vh]">
                    <div class="px-4 py-3 border-b border-gray-800">
                        <div class="font-semibold text-rose-300">永久删除 {{ deletePrompt.items.length }} 条录像？</div>
                        <div class="text-xs text-gray-400 mt-1">
                            源文件、同名 .event 与全部缓存（预览分片 / 波形 / 抽帧 / 代理）一起删除。此操作不可恢复。
                        </div>
                    </div>
                    <div class="px-4 py-2 overflow-y-auto scroll text-xs mono flex-1">
                        <div v-for="it in deletePrompt.items" :key="it.id" class="py-1 border-b border-gray-900 last:border-0">
                            <div class="truncate" :title="it.relPath">{{ it.fileName }}</div>
                            <div class="text-gray-500">{{ fmtSize(it.sizeBytes) }} · {{ fmtDur(it.durationSeconds) }}</div>
                        </div>
                    </div>
                    <div v-if="deleteError" class="px-4 py-2 text-xs text-rose-300 whitespace-pre-wrap border-t border-rose-900/60 max-h-32 overflow-y-auto scroll">{{ deleteError }}</div>
                    <div class="px-4 py-3 border-t border-gray-800 flex items-center gap-2">
                        <span class="text-xs text-gray-500">共 {{ fmtSize(pendingBytes(deletePrompt.items)) }}</span>
                        <span class="flex-1"></span>
                        <button class="tbtn" :disabled="deleting" @click="deletePrompt = null; deleteError = ''">取消</button>
                        <button class="tbtn text-rose-200 border-rose-800 bg-rose-950/60 hover:bg-rose-900/60"
                                :disabled="deleting" @click="confirmDelete">
                            {{ deleting ? '删除中…' : '永久删除' }}
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex flex-1 min-h-0 overflow-hidden">
                <!-- ============================ library ============================ -->
                <aside data-panel="library" :style="{ width: layout.library + 'px' }" class="shrink-0 border-r border-gray-800 flex flex-col min-h-0 min-w-0">
                    <div class="p-3 space-y-2 border-b border-gray-800">
                        <input v-model="q" placeholder="搜索文件 / 房间…"
                               class="w-full bg-[#0f1216] border border-gray-700 rounded px-3 py-1.5 text-sm outline-none focus:border-sky-600" />
                        <div class="flex gap-2">
                            <select v-model="sort" class="flex-1 bg-[#0f1216] border border-gray-700 rounded px-2 py-1 text-xs">
                                <option value="heat">按玩具热度</option>
                                <option value="date">按时间</option>
                                <option value="size">按大小</option>
                                <option value="duration">按时长</option>
                                <option value="room">按房间</option>
                                <option value="name">按文件名</option>
                            </select>
                            <select v-model="roomFilter" class="flex-1 bg-[#0f1216] border border-gray-700 rounded px-2 py-1 text-xs">
                                <option value="">全部房间</option>
                                <option v-for="r in rooms" :key="r.room" :value="r.room">{{ r.room }} ({{ r.count }})</option>
                            </select>
                        </div>
                        <label class="flex items-center gap-2 text-xs text-gray-400 select-none">
                            <input type="checkbox" v-model="eventsOnly" class="accent-sky-600" />
                            只看有 .event 的录制
                            <span class="flex-1"></span>
                            <span class="mono text-gray-500">{{ items.length }}/{{ total }}</span>
                        </label>
                        <div v-if="deleteEnabled && items.length" class="flex items-center gap-2 text-xs">
                            <label class="flex items-center gap-1.5 text-gray-400 select-none">
                                <input type="checkbox" class="accent-sky-600"
                                       :checked="checked.size === items.length && items.length > 0"
                                       @change="toggleCheckAll" />
                                全选
                            </label>
                            <span v-if="checked.size" class="mono text-gray-500">已选 {{ checked.size }}</span>
                            <span class="text-gray-600 hidden sm:inline">Shift 连选 · Ctrl 点选</span>
                            <span class="flex-1"></span>
                            <button v-if="checked.size" class="tbtn"
                                    :class="'text-rose-300 border-rose-800 hover:bg-rose-950/50'"
                                    @click="askDelete(checkedItems())">删除所选</button>
                            <button v-if="checked.size" class="tbtn" @click="clearChecked()">取消</button>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto scroll" @scroll.passive="onLibraryScroll">
                        <div v-if="loading && !items.length" class="p-4 text-sm text-gray-500">加载中…</div>
                        <div v-else-if="!items.length" class="p-4 text-sm text-gray-500">没有索引到录制文件。</div>
                        <div v-for="(it, idx) in items" :key="it.id" @click="onRowClick(idx, $event)"
                             class="group px-3 py-2 border-b border-gray-900 cursor-pointer hover:bg-[#171b21]"
                             :class="checked.has(it.id) ? 'bg-sky-950/40' : (selected && selected.id === it.id ? 'row-active' : '')">
                            <div class="flex items-center gap-2">
                                <input v-if="deleteEnabled" type="checkbox" class="accent-sky-600 shrink-0"
                                       :checked="checked.has(it.id)"
                                       @click.stop="toggleChecked(idx, $event)"
                                       :title="'Shift 点击选一段'" />
                                <span class="text-[13px] truncate flex-1" :title="it.relPath">{{ it.fileName }}</span>
                                <span v-if="it.hasEvents" class="text-[10px] px-1.5 py-px rounded bg-sky-900/70 text-sky-300 shrink-0">event</span>
                                <button v-if="deleteEnabled" @click.stop="askDelete(it)"
                                        class="tbtn shrink-0 opacity-0 group-hover:opacity-100 text-rose-300 border-rose-900 hover:bg-rose-950/60"
                                        title="永久删除这条录像（含 .event 与缓存），不可恢复">删除</button>
                            </div>
                            <div class="flex items-center gap-3 mt-1 text-[11px] text-gray-500 mono">
                                <span>{{ fmtDur(it.durationSeconds) }}</span>
                                <span>{{ fmtSize(it.sizeBytes) }}</span>
                                <span class="truncate">{{ it.room }}</span>
                                <span class="flex-1"></span>
                                <span>{{ fmtDate(it.modifiedAt) }}</span>
                            </div>
                            <div v-if="it.heat" class="flex items-center gap-1.5 mt-1 text-[10px] flex-wrap">
                                <span class="px-1.5 py-px rounded bg-emerald-900/60 text-emerald-300">玩具 {{ Math.round(it.heat.toySeconds) }}s</span>
                                <span v-if="it.heat.specialCommands" class="px-1.5 py-px rounded bg-fuchsia-900/60 text-fuchsia-300">特殊 {{ it.heat.specialCommands }}</span>
                                <span v-if="it.heat.tipTotal" class="px-1.5 py-px rounded bg-amber-900/60 text-amber-300">礼 {{ it.heat.tipTotal }}</span>
                                <span v-if="it.heat.chats" class="px-1.5 py-px rounded bg-gray-800 text-gray-400">聊 {{ it.heat.chats }}</span>
                            </div>
                        </div>
                        <div v-if="items.length" class="p-3 text-center text-xs text-gray-500">
                            <span v-if="libraryLoadingMore">加载中…</span>
                            <button v-else-if="!libraryDone" class="tbtn" @click="loadLibrary(true)">
                                加载更多（已显示 {{ items.length }} / {{ total }}）
                            </button>
                            <span v-else class="text-gray-600">已显示全部 {{ total }} 条</span>
                        </div>
                    </div>
                </aside>

                <!-- =========================== workspace =========================== -->
                <div class="splitter vertical" role="separator" aria-label="调整文件面板宽度" @pointerdown="beginResize($event, layout, 'library', 'x')"></div>
                <main :inert="editorLoading" class="flex-1 flex flex-col min-h-0 min-w-0">
                    <div v-if="!detail" class="flex-1 flex items-center justify-center text-gray-600 text-sm">
                        {{ editorLoading ? '正在恢复编辑页面…' : (message || '从左侧选择一个录制文件') }}
                    </div>
                    <template v-else>
                        <div class="px-4 py-1.5 border-b border-gray-800 shrink-0">
                            <div class="flex items-center gap-3">
                                <span class="text-sm truncate">{{ detail.fileName }}</span>
                                <span class="text-[11px] text-gray-500 mono">{{ tc(duration) }}</span>
                                <span class="text-[11px] text-gray-500 mono">{{ fps.toFixed(2) }}fps</span>
                                <span v-if="lanes" class="text-[11px] px-1.5 py-px rounded"
                                      :style="{ background: CONF_COLOR[lanes.stats.confidence] + '33', color: CONF_COLOR[lanes.stats.confidence] }">
                                    时间置信度 {{ CONF_LABEL[lanes.stats.confidence] }}
                                </span>
                                <span class="flex-1"></span>
                                <span v-if="lanes" class="text-[10px] text-gray-500 mono">
                                    玩具 {{ Math.round(lanes.stats.toyBusySeconds) }}s · 礼物 {{ lanes.stats.tipTotal }} · 特殊 {{ lanes.stats.specialCommandCount }}
                                </span>
                                <button v-if="deleteEnabled && selected" @click="askDelete(selected)"
                                        class="tbtn text-rose-300 border-rose-900 hover:bg-rose-950/60"
                                        title="永久删除这条录像（含 .event 与缓存），不可恢复">删除此录像</button>
                                <span v-else-if="selected && !deleteEnabled"
                                      class="text-[10px] text-gray-600" :title="deleteBlockedReason">
                                    删除不可用（媒体根只读）
                                </span>
                            </div>
                        </div>

                        <div data-panel="video" class="shrink-0 bg-black relative" :style="{ height: layout.video + 'px' }">
                            <video ref="player" class="w-full h-full" playsinline
                                   @timeupdate="onTimeUpdate" @play="onPlaying" @playing="onCanPlay" @pause="onPaused"
                                   @waiting="buffering = true" @canplay="onCanPlay" @ended="onPaused"
                                   @seeked="onSeeked" @progress="refreshBuffered"
                                   @loadedmetadata="onMetadata" @durationchange="refreshBuffered"></video>
                            <!-- scrub preview: a still frame of wherever the playhead is -->
                            <img v-if="scrubFrameUrl" :src="scrubFrameUrl" alt=""
                                 class="absolute inset-0 w-full h-full pointer-events-none"
                                 style="object-fit: contain; background: #000" />
                            <div class="absolute top-2 left-2 text-[11px] mono px-2 py-0.5 rounded bg-black/70 text-gray-300">
                                {{ tc(currentTime) }} <span class="text-gray-500">/ {{ tc(duration) }}</span>
                                <span v-if="playerState" class="ml-2 text-amber-400">{{ playerState }}</span>
                            </div>
                            <div v-if="seeking || (playing && buffering)" class="absolute bottom-2 left-2 text-xs px-2 py-1 rounded bg-black/70 text-sky-300 pointer-events-none">
                                {{ seeking ? '正在加载所选位置…' : '正在缓冲…' }}
                            </div>
                        </div>

                        <div class="splitter horizontal" role="separator" aria-label="调整预览高度" @pointerdown="beginResize($event, layout, 'video')"></div>
                        <!-- transport: grouped by function, LosslessCut-style -->
                        <div class="px-3 py-1.5 border-b border-gray-800 flex items-center gap-1.5 text-xs shrink-0 flex-wrap">
                            <button @click="jumpSegment(-1)" title="上一片段 (↑)" class="tbtn">⏮</button>
                            <button @click="jumpKeyframe(-1)" title="上一关键帧 (Alt+←)" class="tbtn">◀|</button>
                            <button @click="stepFrames(-1)" title="上一帧 (,)" class="tbtn">◀</button>
                            <button @click="togglePlay" :title="playing ? '暂停 (空格)' : '播放 (空格)'"
                                    class="w-9 h-7 rounded bg-sky-600 hover:bg-sky-500 text-white">
                                {{ playing ? '❚❚' : '▶' }}
                            </button>
                            <button @click="stepFrames(1)" title="下一帧 (.)" class="tbtn">▶</button>
                            <button @click="jumpKeyframe(1)" title="下一关键帧 (Alt+→)" class="tbtn">|▶</button>
                            <button @click="jumpSegment(1)" title="下一片段 (↓)" class="tbtn">⏭</button>

                            <span class="w-px h-5 bg-gray-700 mx-1"></span>

                            <button @click="setSegmentBound('start')" title="设置片段起点 (I)" class="tbtn">⇤ 起点</button>
                            <input class="tcbox" readonly
                                   :value="activeSeg >= 0 && segments[activeSeg] ? tc(segments[activeSeg].start) : tc(currentTime)" />
                            <span class="text-gray-600">|</span>
                            <input class="tcbox" readonly
                                   :value="activeSeg >= 0 && segments[activeSeg] && segments[activeSeg].end != null ? tc(segments[activeSeg].end) : '--:--:--.---'" />
                            <button @click="setSegmentBound('end')" title="设置片段终点 (O)" class="tbtn">终点 ⇥</button>
                            <button @click="clearSegmentEnd" title="清除终点，变为标记 (Backspace)" class="tbtn">标记</button>
                            <button @click="splitAtPlayhead" title="在光标处分割 (B)" class="tbtn">分割</button>
                            <button @click="addSegmentAtPlayhead" title="新增片段" class="tbtn">＋片段</button>

                            <span class="w-px h-5 bg-gray-700 mx-1"></span>

                            <span class="text-gray-500">速度</span>
                            <button @click="nudgeRate(-1)" title="减速 (J)" class="tbtn">−</button>
                            <select :value="rate" @change="setRate(Number($event.target.value))" aria-label="播放速度" class="bg-gray-900 border border-gray-700 rounded text-xs mono">
                                <option v-for="r in [0.25,0.5,0.75,1,1.25,1.5,2,3,4,8,16]" :value="r">{{ r }}×</option>
                                <option v-if="![0.25,0.5,0.75,1,1.25,1.5,2,3,4,8,16].includes(rate)" :value="rate">{{ rate.toFixed(2) }}×</option>
                            </select>
                            <button @click="nudgeRate(1)" title="加速 (L)" class="tbtn">＋</button>
                            <button @click="setRate(1)" title="恢复 1× (K)" class="tbtn">1×</button>

                            <span class="flex-1"></span>
                            <span v-if="quality === PROXY_QUALITY" class="flex items-center gap-1.5">
                                <span class="text-gray-500">分辨率</span>
                                <button v-for="h in PROXY_HEIGHTS" :key="h" @click="setProxyHeight(h)"
                                        class="px-1.5 py-0.5 rounded border"
                                        :class="proxyHeight === h ? 'border-emerald-500 text-emerald-400' : 'border-gray-700 hover:bg-gray-800'">
                                    {{ h }}p
                                </button>
                                <span class="text-gray-500">帧率</span>
                                <button v-for="f in PROXY_FPS" :key="f[0]" @click="setProxyFps(f[0])"
                                        class="px-1.5 py-0.5 rounded border"
                                        :class="proxyFps === f[0] ? 'border-emerald-500 text-emerald-400' : 'border-gray-700 hover:bg-gray-800'">
                                    {{ f[1] }}
                                </button>
                                <template v-if="proxy && proxy.status === 'READY'">
                                    <span class="text-emerald-400">就绪</span>
                                    <span class="text-gray-500 mono">{{ (proxy.bytes / 1048576).toFixed(0) }}MB</span>
                                    <button @click="deleteProxy(false)" class="tbtn" title="删除此档代理">删除</button>
                                    <button @click="deleteProxy(true)" class="tbtn" title="删除该录像的全部代理">全部</button>
                                </template>
                                <template v-else-if="proxy && proxy.status === 'RUNNING'">
                                    <span class="text-amber-400">生成中 {{ Math.round(proxy.progress * 100) }}%</span>
                                    <span class="w-24 h-1.5 bg-gray-800 rounded overflow-hidden inline-block">
                                        <span class="block h-full bg-amber-500" :style="{ width: (proxy.progress * 100) + '%' }"></span>
                                    </span>
                                </template>
                                <template v-else-if="proxy && proxy.status === 'FAILED'">
                                    <span class="text-red-400">生成失败</span>
                                    <button @click="buildProxy" class="tbtn">重试</button>
                                </template>
                                <template v-else>
                                    <button @click="buildProxy" class="tbtn">生成 {{ proxyHeight }}p {{ proxyFps || '全帧' }}</button>
                                </template>
                            </span>
                            <span class="text-gray-500">预览</span>
                            <button v-for="qy in QUALITY_ORDER" :key="qy" @click="setQuality(qy)"
                                    :title="qy === RAW_QUALITY ? '直接播放源文件，不转码，画质无损（占用完整源码率）' : ''"
                                    class="px-1.5 py-0.5 rounded border"
                                    :class="quality === qy
                                        ? (qy === RAW_QUALITY ? 'border-emerald-500 text-emerald-400 bg-emerald-950/40' : 'border-sky-600 text-sky-400 bg-sky-950/40')
                                        : 'border-gray-700 hover:bg-gray-800'">
                                {{ qualityLabel(qy) }}
                            </button>
                        </div>

                        <!-- timeline toolbar -->
                        <div class="px-3 py-1 border-b border-gray-800 flex items-center gap-2 text-xs shrink-0 flex-wrap">
                            <span class="text-gray-500">缩放</span>
                            <button @click="zoomBy(1/1.5)" class="tbtn">−</button>
                            <span class="mono w-16 text-center text-gray-300">{{ zoom < 10 ? zoom.toFixed(2) : Math.round(zoom) }}×</span>
                            <button @click="zoomBy(1.5)" class="tbtn">＋</button>
                            <button @click="zoomFit" class="tbtn">全部</button>
                            <button @click="setZoom(zoom * 4)" class="tbtn">×4</button>
                            <button @click="centerOn(currentTime)" class="tbtn">居中</button>
                            <span class="text-gray-600">Ctrl/⌘+滚轮 缩放 · Shift+滚轮 关键帧 · Alt+滚轮 逐帧</span>

                            <span class="w-px h-5 bg-gray-700 mx-1"></span>
                            <label class="flex items-center gap-1 text-gray-400 select-none">
                                <input type="checkbox" v-model="snap" class="accent-sky-600" /> 吸附
                            </label>
                            <label class="flex items-center gap-1 text-gray-400 select-none">
                                <input type="checkbox" v-model="showKeyframes" class="accent-sky-600" /> 关键帧
                            <span class="mono" :class="keyframes.length ? 'text-sky-400' : 'text-gray-600'">{{ keyframes.length }}</span>
                            <span v-if="showKeyframes && !showKeyframeTicks" class="text-gray-600">(放大后显示)</span>
                            </label>
                            <span class="flex-1"></span>
                            <span class="flex items-center gap-1.5 rounded px-1.5 py-0.5"
                                  :class="isDefaultOffset ? '' : 'bg-amber-900/40 ring-1 ring-amber-600'"
                                  title="把该录像的所有 event 统一平移（-3 ~ +17 秒）。车道与建议全部按偏移后的时间重算。默认值为标定出的 +7.0s">
                                <span class="text-gray-500">事件偏移</span>
                                <input type="range" :min="EVENT_OFFSET_MIN" :max="EVENT_OFFSET_MAX" step="0.1"
                                       :value="eventOffset" @input="setEventOffset($event.target.value)" class="w-28" />
                                <span class="mono w-14 text-center"
                                      :class="isDefaultOffset ? 'text-gray-400' : 'text-amber-300'">
                                    {{ eventOffset > 0 ? '+' : '' }}{{ eventOffset.toFixed(1) }}s
                                </span>
                                <button v-if="!isDefaultOffset" @click="resetEventOffset" class="tbtn"
                                        title="回到标定的默认偏移 +7.0s">归位</button>
                            </span>
                            <label class="flex items-center gap-1 text-gray-400"><input type="checkbox" v-model="showThumbnails" /> 缩略图</label>
                            <label v-for="l in [['toy','玩具'],['gifts','礼物'],['level','等级'],['chat','聊天']]" :key="l[0]"
                                   class="flex items-center gap-1 text-gray-400 select-none">
                                <input type="checkbox" v-model="laneFlags[l[0]]" class="accent-sky-600" /> {{ l[1] }}
                            </label>
                            <label class="flex items-center gap-1 text-gray-400 select-none">
                                <input type="checkbox" v-model="showAudio" class="accent-sky-600" /> 电平
                            </label>
                            <label class="flex items-center gap-1 text-gray-400 select-none">
                                <input type="checkbox" v-model="showSpec" class="accent-sky-600" /> 频谱
                            </label>
                        </div>

                        <!-- ========================== timeline ========================== -->
                        <div ref="viewport" @wheel="onWheel" @scroll="onScroll"
                             data-panel="timeline" class="flex-1 overflow-auto scroll select-none relative" style="min-height: 110px; overflow: auto">
                            <div :style="{ width: (zoom * 100) + '%', minWidth: '100%' }" class="relative">

                                <!-- ruler, doubled as a scrub surface -->
                                <div data-lane="ruler" class="lane scrub-zone" :style="{ height: laneHeights.ruler + 'px' }" @pointerdown.prevent="beginScrub">
                                    <div class="lane-resize" role="separator" aria-label="调整刻度尺轨道高度" @pointerdown="beginResize($event, laneHeights, 'ruler')"></div>
                                    <div v-for="tk in rulerTicks" :key="'t'+tk.t" class="tick" :style="{ left: timeToPct(tk.t) + '%' }"></div>
                                    <template v-for="tk in rulerTicks" :key="'mm'+tk.t">
                                        <div v-for="(mt, mi) in tk.minors" :key="'mn'+mi" class="tick minor" :style="{ left: timeToPct(mt) + '%' }"></div>
                                    </template>
                                    <div v-for="tk in rulerTicks" :key="'l'+tk.t" class="absolute text-[10px] text-gray-500 mono"
                                         :style="{ left: timeToPct(tk.t) + '%', top: '4px', paddingLeft: '4px' }">{{ tk.label }}</div>
                                    <div v-for="(k, i) in keyframes" :key="'k'+i" class="kf" :style="{ left: timeToPct(k) + '%' }"></div>
                                    <div v-for="(p, i) in cachedMarks" :key="'cf'+i" class="kf cached" :style="{ left: p + '%' }"
                                         title="该时间戳的帧已缓存"></div>
                                    <!-- browser-side cache: what can be played with no request -->
                                    <div v-for="(b, i) in bufferedMarks" :key="'bf'+i" class="buffered"
                                         :style="{ left: b.left + '%', width: b.width + '%' }"
                                         title="浏览器已缓冲（本地缓存）"></div>
                                </div>

                                <div v-if="showThumbnails" data-lane="thumbnails" class="lane" :style="{ height: laneHeights.thumbnails + 'px' }"
                                     @pointerdown.prevent="beginScrub" @pointermove="onLaneHover" @pointerleave="closeHoverPreview">
                                    <div v-for="cell in thumbnailCells" :key="cell.level + ':' + cell.t" class="thumbnail"
                                         :style="{ left: timeToPct(cell.t) + '%', width: widthToPct(cell.t, cell.end) + '%' }" :title="tc(cell.t)">
                                        <img v-if="thumbnailUrl(cell)" :src="thumbnailUrl(cell)" alt="时间轴缩略图" draggable="false" />
                                        <span v-if="showCellTime(cell)" class="mono">{{ fmtDur(cell.t) }}</span>
                                    </div>
                                    <div class="lane-label">缩略图</div>
                                    <div class="lane-resize" role="separator" aria-label="调整缩略图轨道高度" @pointerdown="beginResize($event, laneHeights, 'thumbnails')"></div>
                                </div>

                                <!-- clip track -->
                                <div data-lane="clips" ref="track" class="lane" :style="{ height: laneHeights.clips + 'px' }" @pointerdown.prevent="beginScrub">
                                    <div class="lane-resize" role="separator" aria-label="调整片段轨道高度" @pointerdown="beginResize($event, laneHeights, 'clips')"></div>
                                    <div class="lane-label">片段 {{ segments.length }}</div>
                                    <div v-if="!segments.length"
                                         class="absolute inset-0 flex items-center justify-center text-[10px] text-gray-600 pointer-events-none">
                                        接受右侧建议，或在光标处按 I / O 设置起止
                                    </div>
                                    <div v-for="(s, i) in segments" :key="s.id" class="clip"
                                         :class="[s.selected ? 'selected' : 'unselected', { active: activeSeg === i, marker: s.end == null }]"
                                         :style="s.end == null
                                             ? { left: timeToPct(s.start) + '%', width: '0.2%' }
                                             : { left: timeToPct(s.start) + '%', width: Math.max(0.12, widthToPct(s.start, s.end)) + '%' }"
                                         :title="tc(s.start) + ' → ' + (s.end == null ? '标记' : tc(s.end)) + (s.name ? ' · ' + s.name : '')"
                                         @pointerdown="beginClipDrag($event, i, 'move')"
                                         @dblclick.stop="activeSeg = i; seekToTime(s.start)">
                                        <div class="handle h-l" @pointerdown.stop="beginClipDrag($event, i, 'trim-start')"></div>
                                        <div class="handle h-r" @pointerdown.stop="beginClipDrag($event, i, 'trim-end')"></div>
                                        <span class="badge">{{ i + 1 }}</span>
                                        <span class="label">
                                            <template v-if="s.end == null">◆ {{ s.name || '标记' }}</template>
                                            <template v-else-if="(s.end - s.start) * pxPerSecond > 110">
                                                {{ s.name || '片段' }} · {{ (s.end - s.start).toFixed(1) }}s
                                            </template>
                                        </span>
                                    </div>
                                </div>

                                <div data-lane="toy" v-show="laneFlags.toy" class="lane" :style="{ height: laneHeights.toy + 'px' }">
                                    <div class="lane-resize" role="separator" aria-label="调整玩具轨道高度" @pointerdown="beginResize($event, laneHeights, 'toy')"></div>
                                    <div class="lane-label">玩具运行</div>
                                    <div v-for="(iv, i) in (lanes ? lanes.toyIntervals : [])" :key="'ty'+i" :style="{ left: timeToPct(iv.start) + '%', width: Math.max(0.05, widthToPct(iv.start, iv.end)) + '%', background: '#0f766ecc' }" :title="tc(iv.start) + ' → ' + tc(iv.end) + ' (' + Math.round(iv.end-iv.start) + 's) ' + POWER_LABEL[iv.power] + (iv.action ? ' · ' + iv.action : '') + ' · 点击跳转'" @click="seekToTime(iv.start, {center:true})" class="mark rounded-sm cursor-pointer hover:brightness-125"></div>
                                    <div v-for="(sp, i) in (lanes ? lanes.toySpecials : [])" :key="'sp'+i" :style="{ left: timeToPct(sp.t) + '%', width: '2px', background: '#e879f9' }" :title="tc(sp.t) + ' · ' + sp.action + ' · 点击跳转'" @click="seekToTime(sp.t, {center:true})" class="mark cursor-pointer hover:brightness-150"></div>
                                </div>

                                <div data-lane="gifts" v-show="laneFlags.gifts" class="lane" :style="{ height: laneHeights.gifts + 'px' }">
                                    <div class="lane-resize" role="separator" aria-label="调整礼物轨道高度" @pointerdown="beginResize($event, laneHeights, 'gifts')"></div>
                                    <div class="lane-label">礼物 / 场次</div>
                                    <div v-for="(g, i) in giftMarks" :key="'g'+i" :style="{ left: g.left + '%', width: g.w + '%', bottom: '0', top: 'auto', height: (g.h * 100) + '%', background: g.color }" :title="g.title + ' · 点击跳转'" @click="seekToTime(g.t, {center:true})" class="mark cursor-pointer hover:brightness-150"></div>
                                </div>

                                <div data-lane="level" v-show="laneFlags.level" class="lane" :style="{ height: laneHeights.level + 'px' }">
                                    <div class="lane-resize" role="separator" aria-label="调整等级轨道高度" @pointerdown="beginResize($event, laneHeights, 'level')"></div>
                                    <div class="lane-label">玩具等级</div>
                                    <div v-for="(b, i) in levelBuckets" :key="'lv'+i" :style="{ left: b.left + '%', width: b.w + '%', bottom: '0', top: 'auto', height: (b.power / 4 * 100) + '%', background: POWER_COLOR[b.power] + 'dd' }" :title="tc(b.t) + ' · ' + POWER_LABEL[b.power] + ' · 点击跳转'" @click="seekToTime(b.t, {center:true})" class="mark cursor-pointer hover:brightness-150"></div>
                                </div>

                                <div data-lane="chat" v-show="laneFlags.chat" class="lane" :style="{ height: laneHeights.chat + 'px' }">
                                    <div class="lane-resize" role="separator" aria-label="调整聊天轨道高度" @pointerdown="beginResize($event, laneHeights, 'chat')"></div>
                                    <div class="lane-label">聊天密度</div>
                                    <div v-for="(b, i) in chatBuckets" :key="'ch'+i" :style="{ left: b.left + '%', width: b.w + '%', bottom: '0', top: 'auto', height: (b.h * 100) + '%', background: '#38bdf8aa' }" :title="tc(b.t) + ' · 点击跳转'" @click="seekToTime(b.t, {center:true})" class="mark cursor-pointer hover:brightness-150"></div>
                                </div>

                                <div data-lane="audio" v-show="showAudio" class="lane" :style="{ height: laneHeights.audio + 'px' }">
                                    <div class="lane-resize" role="separator" aria-label="调整音频轨道高度" @pointerdown="beginResize($event, laneHeights, 'audio')"></div>
                                    <div class="lane-label">音频电平</div>
                                    <img v-if="audioOverviewUrl" :src="audioOverviewUrl" alt=""
                                         class="absolute inset-0 w-full h-full"
                                         style="object-fit: fill; image-rendering: pixelated; opacity: .9" />
                                </div>

                                <div data-lane="spec" v-show="showSpec" class="lane" :style="{ height: laneHeights.spec + 'px' }">
                                    <div class="lane-resize" role="separator" aria-label="调整频谱轨道高度" @pointerdown="beginResize($event, laneHeights, 'spec')"></div>
                                    <div class="lane-label">频谱</div>
                                    <img v-if="spectrogramUrl" :src="spectrogramUrl" alt=""
                                         class="absolute inset-0 w-full h-full"
                                         style="object-fit: fill; image-rendering: pixelated; opacity: .9" />
                                </div>

                                <!-- playhead spanning every lane -->
                                <div class="playhead" :style="{ left: timeToPct(currentTime) + '%' }">
                                    <div class="playhead-head" @pointerdown.stop.prevent="beginScrub"></div>
                                </div>

                            </div>
                            <!-- Hover preview. It is a sibling of the scrolled content, not a
                                 child of it, so it stays put while the lanes scroll under it
                                 and can sit *above* the ruler rather than on top of it. -->
                            <div v-if="hoverPreviewOpen" class="hover-popup" :style="hoverStyle">
                                <img v-if="hoverPreview" :src="hoverPreview" alt="" draggable="false" />
                                <span class="hover-tc mono">{{ tc(hoverTimecode) }}</span>
                            </div>
                            <div v-if="hoverPreviewOpen" class="hover-cursor" :style="{ left: hoverMarkLeft }"></div>
                        </div>

                        <div v-if="tableEvents.length" class="splitter horizontal" role="separator" aria-label="调整事件面板高度" @pointerdown="beginResize($event, layout, 'events', 'y', -1)"></div>
                        <div v-if="tableEvents.length" :style="{ height: layout.events + 'px' }" class="shrink-0 border-t border-gray-800 overflow-y-auto scroll">
                            <table class="w-full text-[11px] mono">
                                <thead class="sticky top-0 bg-[#12151a] text-gray-500">
                                    <tr>
                                        <th class="text-left px-2 py-1 font-normal">时间</th>
                                        <th class="text-left px-2 py-1 font-normal">类型</th>
                                        <th class="text-left px-2 py-1 font-normal">详情</th>
                                        <th class="text-left px-2 py-1 font-normal">置信</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(e, i) in tableEvents" :key="i"
                                        @click="e.t != null && seekToTime(e.t, {center:true})"
                                        class="border-b border-gray-900 hover:bg-[#171b21] cursor-pointer">
                                        <td class="px-2 py-0.5 text-gray-400">{{ e.t == null ? '--:--' : fmtDur(e.t) }}</td>
                                        <td class="px-2 py-0.5">
                                            <span :style="{ color: e.kind === 'TOY_CMD' ? '#34d399' : e.kind === 'TIP' ? '#fbbf24'
                                                                  : e.kind === 'SHOW' ? '#f472b6' : e.kind === 'GOAL' ? '#a78bfa' : '#9ca3af' }">
                                                {{ e.kind }}
                                            </span>
                                        </td>
                                        <td class="px-2 py-0.5 text-gray-300 truncate" style="max-width: 28rem">
                                            <template v-if="e.action">{{ e.action }} <span v-if="e.seconds">({{ e.seconds }}s)</span></template>
                                            <template v-else-if="e.amount">{{ e.amount }} <span class="text-gray-500">{{ e.source || '' }}</span></template>
                                            <template v-else>{{ e.text || e.goalText || '' }}</template>
                                        </td>
                                        <td class="px-2 py-0.5" :style="{ color: CONF_COLOR[e.confidence] }">{{ CONF_LABEL[e.confidence] }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </main>

                <!-- ======================= right rail ======================= -->
                <div v-if="detail" class="splitter vertical" role="separator" aria-label="调整当前标签页面板宽度" @pointerdown="beginResize($event, layout, rightTab, 'x', -1)"></div>
                <aside v-if="detail" :inert="editorLoading" data-panel="tabs" :style="{ width: layout[rightTab] + 'px' }" class="shrink-0 border-l border-gray-800 flex flex-col min-h-0 min-w-0">
                    <div class="flex border-b border-gray-800 text-xs shrink-0">
                        <button v-for="t in [['suggest','建议'],['segments','片段'],['export','导出']]" :key="t[0]"
                                @click="rightTab = t[0]" class="flex-1 px-3 py-2"
                                :class="rightTab === t[0] ? 'bg-[#171b21] text-sky-400 border-b-2 border-sky-500' : 'text-gray-400 hover:bg-[#141821]'">
                            {{ t[1] }}
                            <span v-if="t[0]==='suggest' && suggestions.length" class="ml-1 text-gray-500">{{ suggestions.length }}</span>
                            <span v-if="t[0]==='segments' && segments.length" class="ml-1 text-gray-500">{{ segments.length }}</span>
                        </button>
                    </div>
                    <div v-if="message" class="px-3 py-1 text-[11px] text-amber-300 border-b border-gray-800">{{ message }}</div>

                    <div v-show="rightTab === 'suggest'" class="flex-1 overflow-y-auto scroll">
                        <div class="p-3 space-y-2 border-b border-gray-800">
                            <div class="flex items-center gap-2 text-xs">
                                <select v-model="prefs.preset" @change="onPrefsChanged"
                                        class="flex-1 bg-[#0f1216] border border-gray-700 rounded px-2 py-1 text-xs">
                                    <option value="toypure">纯玩具运行（只看玩具是否在跑）</option>
                                    <option value="toy">玩具/gift 时刻</option>
                                    <option value="show">私密场次</option>
                                    <option value="chatty">聊天活跃</option>
                                    <option value="everything">全部</option>
                                </select>
                                <button @click="loadSuggestions" class="tbtn">重算</button>
                            </div>
                            <label v-for="sl in [['mergeGap','黏合空洞 (s)',1,120],['minBlock','最短片段 (s)',5,300],['padBefore','前置 (s)',0,60],['padAfter','后置 (s)',0,60],['minScore','最低分',0,3]]"
                                   :key="sl[0]" class="block text-[11px] text-gray-400">
                                <span class="flex justify-between"><span>{{ sl[1] }}</span><span class="mono text-gray-500">{{ prefs[sl[0]] }}</span></span>
                                <input type="range" :min="sl[2]" :max="sl[3]" :step="sl[0]==='minScore' ? 0.05 : 1"
                                       v-model.number="prefs[sl[0]]" @input="onPrefsChanged" class="w-full" />
                            </label>
                            <button @click="acceptAll" :disabled="!suggestions.length"
                                    class="w-full text-xs px-3 py-1.5 rounded bg-sky-800 hover:bg-sky-700 disabled:opacity-40">
                                全部接受（{{ suggestions.length }}）
                            </button>
                        </div>
                        <div v-if="suggestLoading" class="p-3 text-xs text-gray-500">计算中…</div>
                        <div v-else-if="!suggestions.length" class="p-3 text-xs text-gray-500">没有建议。降低「最低分」或「最短片段」。</div>
                        <div v-for="(b, i) in suggestions" :key="i" class="px-3 py-2 border-b border-gray-900 hover:bg-[#171b21]">
                            <div class="flex items-center gap-2">
                                <button @click="seekToTime(b.start, {center:true})" class="mono text-[12px] text-sky-400 hover:underline">
                                    {{ fmtDur(b.start) }} → {{ fmtDur(b.end) }}
                                </button>
                                <span class="text-[10px] text-gray-500 mono">{{ Math.round(b.end-b.start) }}s</span>
                                <span class="flex-1"></span>
                                <span class="text-[10px] mono px-1.5 py-px rounded bg-gray-800 text-gray-300">{{ b.score.toFixed(1) }}</span>
                                <button @click="acceptSuggestion(b)" class="text-[11px] px-2 py-0.5 rounded border border-sky-700 text-sky-300 hover:bg-sky-900/40">接受</button>
                            </div>
                            <div class="flex flex-wrap gap-1 mt-1">
                                <span v-for="(r, j) in b.reasons" :key="j" class="text-[10px] px-1.5 py-px rounded"
                                      :style="{ background: (r.kind==='TOY' ? '#0f766e55' : r.kind==='TIP' ? '#b4530955'
                                              : r.kind==='SPECIAL' ? '#a21caf55' : r.kind==='SHOW' ? '#be185d55' : '#37415155') }">
                                    {{ r.detail }}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div v-show="rightTab === 'segments'" class="flex-1 flex flex-col min-h-0">
                        <div class="p-2 flex flex-wrap items-center gap-1 border-b border-gray-800 text-[11px] shrink-0">
                            <button @click="addSegmentAtPlayhead" class="tbtn">＋片段</button>
                            <button @click="saveProject" class="tbtn">保存 .llc</button>
                            <button @click="mergeSegments" :disabled="mergeCandidates.length < 2" class="tbtn disabled:opacity-40" title="合并勾选的有终点片段，包含中间间隔；不覆盖未勾选片段">合并勾选</button>
                            <button @click="undoEdit" :disabled="!undoStack.length" class="tbtn disabled:opacity-40" title="撤销 (Ctrl/⌘+Z)">撤销</button>
                            <button @click="redoEdit" :disabled="!redoStack.length" class="tbtn disabled:opacity-40" title="重做 (Ctrl/⌘+Shift+Z)">重做</button>
                            <span class="flex-1"></span>
                            <span class="text-gray-500 mono">{{ exportable.length }} 可导出</span>
                        </div>
                        <div class="flex-1 overflow-y-auto scroll">
                            <div v-if="!segments.length" class="p-3 text-xs text-gray-500">
                                还没有片段。接受建议，或在时间轴上按 I / O 设置起止。
                            </div>
                            <div v-for="(sg, i) in segments" :key="sg.id" @click="activeSeg = i; seekToTime(sg.start, {center:true})"
                                 class="px-2 py-1.5 border-b border-gray-900 cursor-pointer hover:bg-[#171b21]"
                                 :class="{ 'row-active': activeSeg === i }">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[10px] mono w-5 text-gray-500">{{ i + 1 }}</span>
                                    <input type="checkbox" v-model="sg.selected" class="accent-sky-600" @click.stop />
                                    <input :value="sg.start" type="number" step="0.001" min="0" :max="duration" aria-label="片段开始时间" @change="editSegmentInput(i, 'start', $event)" @click.stop
                                           class="w-[4.4rem] bg-[#0f1216] border border-gray-700 rounded px-1 py-0.5 text-[11px] mono" />
                                    <span class="text-gray-600 text-[11px]">→</span>
                                    <input :value="sg.end" type="number" step="0.001" min="0" :max="duration" aria-label="片段结束时间" placeholder="标记" @change="editSegmentInput(i, 'end', $event)" @click.stop
                                           class="w-[4.4rem] bg-[#0f1216] border border-gray-700 rounded px-1 py-0.5 text-[11px] mono" />
                                    <span class="text-[10px] text-gray-500 mono w-9 text-right">
                                        {{ sg.end ? Math.round(sg.end - sg.start) + 's' : '标记' }}
                                    </span>
                                    <button @click.stop="removeSegment(i)" class="text-[11px] text-red-400 hover:text-red-300">✕</button>
                                </div>
                                <input v-model="sg.name" placeholder="名称" @click.stop
                                       class="w-full mt-1 bg-[#0f1216] border border-gray-800 rounded px-1 py-0.5 text-[11px] text-gray-300" />
                            </div>
                        </div>
                        <div class="p-2 border-t border-gray-800 shrink-0">
                            <div class="flex items-center gap-2 text-[11px]">
                                <input v-model="outputDir" placeholder="输出目录（默认服务端配置）"
                                       class="flex-1 bg-[#0f1216] border border-gray-700 rounded px-2 py-1" />
                                <button @click="exportSegments" class="px-3 py-1 rounded bg-emerald-800 hover:bg-emerald-700 whitespace-nowrap">
                                    导出 ({{ exportable.length }})
                                </button>
                            </div>
                            <div class="text-[10px] text-gray-500 mt-1">始终 -c copy 无损剪切；切点自动对齐关键帧</div>
                        </div>
                    </div>

                    <div v-show="rightTab === 'export'" class="flex-1 flex flex-col min-h-0">
                        <!-- Persisted instance-wide, so it survives a browser change and
                             applies to every recording. Disabled without a writable media
                             root, since deleting a source is then impossible anyway. -->
                        <label class="px-3 py-2 border-b border-gray-800 flex items-start gap-2 text-[11px] select-none"
                               :class="settings.deleteSourceAfterExport ? 'text-rose-300' : 'text-gray-400'">
                            <input type="checkbox" class="accent-rose-600 mt-0.5"
                                   :checked="!!settings.deleteSourceAfterExport"
                                   :disabled="savingSettings || !deleteEnabled"
                                   @change="setDeleteAfterExport($event.target.checked)" />
                            <span>
                                导出后删除源文件
                                <span class="block text-gray-500 mt-0.5">
                                    该录像的片段导出完成后删除源文件——<strong>只导出片段也会删除整条录像</strong>，
                                    未导出的部分一并丢失，此操作不可恢复。本次未成功导出任何片段时不会删除。
                                    {{ deleteEnabled ? '' : '（媒体根只读，暂不可用）' }}
                                </span>
                                <span v-if="settings.error" class="block text-rose-400 mt-0.5">{{ settings.error }}</span>
                            </span>
                        </label>
                        <div v-if="!exportJob" class="p-3 text-xs text-gray-500">还没有导出任务。</div>
                        <template v-else>
                            <div class="px-3 py-2 border-b border-gray-800 text-[11px]">
                                <div class="flex items-center gap-2">
                                    <span class="mono">{{ exportJob.id }}</span>
                                    <span class="px-1.5 py-px rounded"
                                          :class="exportJob.state === 'DONE' ? 'bg-emerald-900/60 text-emerald-300' : 'bg-amber-900/60 text-amber-300'">
                                        {{ exportJob.state }}
                                    </span>
                                    <span class="flex-1"></span>
                                    <span class="mono text-gray-400">{{ exportJob.completed }}/{{ exportJob.total }}</span>
                                </div>
                                <div v-for="(it, i) in exportJob.items" :key="i" class="mt-1 flex items-center gap-2">
                                    <span class="text-[10px] px-1 py-px rounded"
                                          :class="it.state === 'DONE' ? 'bg-emerald-900/50 text-emerald-300'
                                                : it.state === 'FAILED' ? 'bg-red-900/50 text-red-300' : 'bg-gray-800 text-gray-400'">
                                        {{ it.state }}
                                    </span>
                                    <span class="truncate flex-1 text-gray-300">{{ it.outputName || it.sourceName }}</span>
                                    <span v-if="it.snapDelta" class="text-[10px] text-amber-400 mono">{{ it.snapDelta.toFixed(2) }}s</span>
                                </div>
                            </div>
                            <div class="flex-1 overflow-y-auto scroll p-2 text-[10px] mono text-gray-400 space-y-px">
                                <div v-for="(l, i) in exportJob.log" :key="i">{{ l }}</div>
                            </div>
                        </template>
                    </div>
                </aside>
            </div>
            `
        }
        createApp(app).mount('#app')
    </script>
</body>

</html>
