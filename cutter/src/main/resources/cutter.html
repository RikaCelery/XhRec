<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XhCut</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
        { "imports": { "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js" } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <style>
        :root { color-scheme: dark; }
        html, body { height: 100%; margin: 0; }
        body { background: #0b0d10; color: #e5e7eb; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
        .scroll::-webkit-scrollbar { width: 9px; height: 9px; }
        .scroll::-webkit-scrollbar-track { background: #14171c; }
        .scroll::-webkit-scrollbar-thumb { background: #333a45; border-radius: 4px; }
        .scroll::-webkit-scrollbar-thumb:hover { background: #454e5c; }
        .row-active { background: #1d2a3a !important; }
        .tbtn { padding: 2px 7px; border-radius: 4px; border: 1px solid #374151; color: #cbd5e1; }
        .tbtn:hover { background: #1f2937; }
        .tcbox { width: 7.4rem; background: #0f1216; border: 1px solid #374151; border-radius: 4px;
                 padding: 2px 5px; text-align: center; color: #e5e7eb;
                 font-family: ui-monospace, Menlo, monospace; font-size: 11px; }

        /* ---------------------------------------------------------------- timeline
           Percent-positioned boxes inside a container whose width is `zoom * 100%`,
           so the ruler, clips, every lane and the playhead share one coordinate
           system and stay aligned at any zoom. */
        .lane { position: relative; height: 22px; background: #101317; border-bottom: 1px solid #171b21; }
        .lane-label { position: absolute; left: 0; top: 0; z-index: 24; font-size: 10px; color: #6b7280;
                      background: rgba(11,13,16,.72); padding: 1px 4px; pointer-events: none; }
        .mark { position: absolute; top: 0; bottom: 0; }

        /* Clips: an NLE look — body, number badge, label, and trim handles. */
        .clip { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; overflow: hidden;
                border: 1px solid rgba(0,0,0,.55); cursor: grab; user-select: none; }
        .clip.selected { background: linear-gradient(180deg, #5c8a3c, #40632a); }
        .clip.unselected { background: linear-gradient(180deg, #4a4a52, #35353c); }
        .clip.active { background: linear-gradient(180deg, #a9714a, #7d4f31); box-shadow: 0 0 0 2px #f59e0b inset; }
        .clip.marker { min-width: 3px; background: linear-gradient(180deg, #a855f7, #7e22ce); }
        .clip .handle { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 3; }
        .clip .handle:hover { background: rgba(255,255,255,.4); }
        .clip .h-l { left: 0; } .clip .h-r { right: 0; }
        .clip .badge { position: absolute; left: 3px; top: 1px; font-size: 9px; line-height: 1.3;
                       background: rgba(0,0,0,.55); color: #fff; padding: 0 3px; border-radius: 2px; z-index: 2; }
        .clip .label { position: absolute; left: 4px; bottom: 2px; right: 4px; font-size: 10px; color: #f3f4f6;
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; z-index: 2; }

        .kf { position: absolute; bottom: 0; width: 1px; height: 7px; background: #94a3b8; opacity: .85; }
        /* Already-cached frame timestamps, After Effects style. */
        .kf.cached { height: 4px; background: #22c55e; width: 3px; border-radius: 1px; opacity: .95; }
        /* Browser buffered range — the client-side cache bar. */
        .buffered { position: absolute; bottom: 5px; height: 3px; background: #0ea5e9; opacity: .9; }
        .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #262c34; }
        .tick.minor { top: 65%; }

        /* Playhead: one line spanning every lane, with a grabbable head. */
        .playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: #ef4444; z-index: 30; pointer-events: none; }
        .playhead-head { position: absolute; top: 0; left: -6px; width: 13px; height: 12px; background: #ef4444;
                         clip-path: polygon(0 0, 100% 0, 50% 100%); pointer-events: auto; cursor: ew-resize; }
        .scrub-zone { cursor: ew-resize; }
        .splitter { flex-shrink: 0; background: #19212b; touch-action: none; z-index: 40; }
        .splitter:hover, .splitter:active { background: #0284c7; }
        .splitter.vertical { width: 6px; cursor: col-resize; }
        .splitter.horizontal { height: 6px; cursor: row-resize; }
        .lane-resize { position: absolute; bottom: 0; left: 0; right: 0; height: 5px; cursor: row-resize;
                       z-index: 35; touch-action: none; border-bottom: 1px solid #334155; }
        .lane-resize:hover { background: #0284c7; }
        /* A frame fills its cell in both directions, whatever height the lane is dragged
           to: `cover` scales it until neither axis can show the cell's background, and the
           default centre crop decides what is dropped. No per-cell arithmetic is involved
           — the image simply *is* the cell's box — and the other half of the contract is
           `thumbFrameWidth`, which keeps the source wide enough that `cover` never has to
           upscale. */
        .thumbnail { position: absolute; top: 0; bottom: 5px; border-right: 1px solid #334155; overflow: hidden; background: #17202b; }
        .thumbnail img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .thumbnail span { position: absolute; bottom: 0; left: 0; padding: 0 3px; background: #000a; font-size: 10px; z-index: 1; }
        /* Hover preview: a big frame pinned to the top of the visible timeline. */
        .hover-popup { position: fixed; z-index: 60; pointer-events: none; background: #000;
                       border: 1px solid #475569; border-radius: 4px; overflow: hidden; box-shadow: 0 12px 28px rgba(0,0,0,.6); }
        .hover-popup img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
        .hover-popup .hover-tc { position: absolute; left: 0; bottom: 0; padding: 1px 6px; background: #000c;
                                 font-size: 12px; color: #e5e7eb; }
        /* The instant the cursor is over, as a tick on the ruler. Deliberately short: it
           marks a position, and a line spanning the panel would cut through the popup. */
        .hover-cursor { position: absolute; top: 0; height: 34px; width: 2px; background: #fbbf24; z-index: 47; pointer-events: none; }
    </style>
</head>

<body>
    <div id="app" class="h-screen flex flex-col"></div>

    <script type="module">
        import { createApp, ref, computed, watch, onMounted, nextTick } from 'vue'

        // ---------------------------------------------------------------- helpers
        const pad = (n, w = 2) => String(Math.floor(n)).padStart(w, '0')

        /** `HH:MM:SS.mmm` — the timecode style used by the transport readouts. */
        const tc = (s) => {
            if (s == null || !isFinite(s)) return '00:00:00.000'
            const neg = s < 0
            s = Math.abs(s)
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60)
            const ms = Math.round((s - Math.floor(s)) * 1000)
            return `${neg ? '-' : ''}${pad(h)}:${pad(m)}:${pad(sec)}.${pad(ms, 3)}`
        }
        const fmtDur = (s) => {
            if (s == null || !isFinite(s)) return '--:--'
            s = Math.floor(s)
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60
            return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`
        }
        const fmtSize = (b) => {
            if (b == null || b === 0) return '-'
            const u = ['B', 'KB', 'MB', 'GB', 'TB']
            let i = 0, v = b
            while (v >= 1024 && i < u.length - 1) { v /= 1024; i++ }
            return `${v.toFixed(v < 10 && i > 0 ? 1 : 0)}${u[i]}`
        }
        const fmtDate = (ms) => ms ? new Date(ms).toLocaleString('zh-CN', { hour12: false }) : '-'

        const POWER_LABEL = ['-', '低', '中', '高', '极高']
        const POWER_COLOR = ['#374151', '#4d7c0f', '#0e7490', '#b45309', '#b91c1c']
        const CONF_LABEL = { EXACT: '精确', INTERPOLATED: '插值', EXTRAPOLATED: '外推', NONE: '无' }
        const CONF_COLOR = { EXACT: '#10b981', INTERPOLATED: '#eab308', EXTRAPOLATED: '#f97316', NONE: '#6b7280' }
        const ZOOM_MAX = 8192
        /** Sentinel quality that streams the original file instead of transcoding. */
        const RAW_QUALITY = 'raw'
        /**
         * Locally cached faststart proxy: the browser decodes and buffers it itself.
         *
         * The source recordings are not faststart (the index sits at the tail), so
         * pointing <video> at them stalls for ~30 s before a single frame appears.
         * The proxy is small, has its index at the front, and therefore starts and
         * seeks immediately — with all decoding and buffering done client-side.
         */
        const PROXY_QUALITY = 'proxy'
        /** Jumps longer than this get a still-frame preview while the player catches up. */
        const FAR_SEEK_SECONDS = 10
        const QUALITY_ORDER = ['tiny', 'low', 'mid', 'high', RAW_QUALITY, PROXY_QUALITY]
        const qualityLabel = (q) => (q === RAW_QUALITY ? '无损' : q === PROXY_QUALITY ? '本地代理' : q)
        const round3 = (v) => Math.round(v * 1000) / 1000
        const readStored = key => { try { return JSON.parse(localStorage.getItem(key)) } catch { return null } }
        const clamp = (v, min, max) => Math.max(min, Math.min(max, v))

        const app = {
            setup() {
                // ------------------------------------------------------------ state
                const health = ref(null)
                const items = ref([])
                /**
                 * Page size. The index holds ~32k recordings and the list is only ever the
                 * current page, so this is a window onto the server's full sorted result,
                 * not a cap: `offset` walks the rest as the user scrolls.
                 */
                const LIBRARY_PAGE = 300
                const libraryOffset = ref(0)
                const libraryDone = ref(false)
                /** Guards against a slow page landing after the filter changed under it. */
                let libraryGeneration = 0
                const libraryLoadingMore = ref(false)
                /**
                 * Whether the server can actually unlink recordings.
                 *
                 * The media root is mounted read-only in the shipped deployment, and an
                 * unlink against a read-only mount cannot succeed. Rather than offer a
                 * button that always fails, the controls are disabled with the reason —
                 * the server probes the root on every request, so flipping the mount to
                 * rw is picked up on the next reload without a restart.
                 */
                const deleteEnabled = ref(false)
                const deleteBlockedReason = ref('')
                /**
                 * Instance-wide settings, stored server-side (`/api/settings`).
                 *
                 * Keeping them off `localStorage` is deliberate: they decide what happens to
                 * files on the NAS, so they must not differ per browser.
                 */
                const settings = ref({ deleteSourceAfterExport: false, error: null })
                const savingSettings = ref(false)
                /** Ids ticked in the library for a bulk delete. */
                const checked = ref(new Set())
                /** Pending confirmation: { items: [...] } or null. */
                const deletePrompt = ref(null)
                const deleting = ref(false)
                const deleteError = ref('')
                const rooms = ref([])
                const total = ref(0)
                const loading = ref(false)
                const scanning = ref(false)
                const selected = ref(null)
                const detail = ref(null)
                const lanes = ref(null)
                const lanesLoading = ref(false)

                const q = ref('')
                const sort = ref('heat')
                const roomFilter = ref('')
                const eventsOnly = ref(true)

                const player = ref(null)
                const playerState = ref('')
                const quality = ref('low')
                const showAudio = ref(true)
                const showSpec = ref(false)
                let hls = null

                const segments = ref([])
                const suggestions = ref([])
                const suggestLoading = ref(false)
                const prefs = ref({ mergeGap: 15, minBlock: 45, padBefore: 8, padAfter: 6, minScore: 0.35, preset: 'toy' })
                const rightTab = ref('suggest')
                const activeSeg = ref(-1)
                const exportJob = ref(null)
                const outputDir = ref('')
                const message = ref('')
                let suggestTimer = null

                const viewport = ref(null)
                const track = ref(null)
                const zoom = ref(1)
                const scrollLeft = ref(0)
                const currentTime = ref(0)
                const playing = ref(false)
                const rate = ref(1)
                const snap = ref(true)
                const showKeyframes = ref(true)
                const keyframes = ref([])
                const scrubPreview = ref(false)
                /** Still frame shown while scrubbing; see scheduleScrubFrame. */
                const scrubFrameUrl = ref(null)
                const proxy = ref(null)            // latest proxy status from the server
                /** Proxy resolutions offered; 240p is for a weak link, 480p for detail. */
                const PROXY_HEIGHTS = [240, 480]
                const proxyHeight = ref(480)
                /** Frame rates offered; dropping frames is the single biggest speed lever. */
                const PROXY_FPS = [[2, '2fps 最快'], [5, '5fps'], [0, '全帧']]
                const proxyFps = ref(5)
                const buffered = ref([])           // [[start,end], ...] the browser holds
                let proxyPoll = null
                let frameTimer = null
                let pendingSeek = null
                const buffering = ref(false)
                const seeking = ref(false)
                const drag = ref(null)
                let kfTimer = null
                const kfCache = new Map()

                const laneFlags = ref({ toy: true, gifts: true, level: true, chat: false })
                const layout = ref({ library: 280, video: 250, events: 110, suggest: 320, segments: 340, export: 320 })
                const laneHeights = ref({ ruler: 26, thumbnails: 70, clips: 46, toy: 28, gifts: 28, level: 28, chat: 24, audio: 44, spec: 64 })
                /**
                 * Uniform shift applied to every parsed event, in seconds.
                 *
                 * Event times come from the recording's file-name start stamp, which is
                 * taken when the writer opens the file and can sit a little off the
                 * media timeline; this nudges the whole event layer to line up. It is a
                 * per-recording value — every recording's stamp is off by its own
                 * amount — so it lives in the per-editor state, not global preferences.
                 */
                const EVENT_OFFSET_MIN = -3
                const EVENT_OFFSET_MAX = 17
                /**
                 * Calibrated default shift, matching DEFAULT_EVENT_NUDGE_SECONDS on the server.
                 *
                 * A recording's file-name stamp is written when the writer opens the file, a few
                 * seconds after the platform's stream clock starts, so events land late by that gap
                 * until they are nudged. Measured at +7.0 s on four independent anchors across two
                 * recordings, with no drift over 8.6 h; see docs/toy-activation-research.md.
                 *
                 * Only the event lanes move: cut points and exports are in video time, so this can
                 * never shift an edit. A per-recording value saved in the editor state wins.
                 */
                const DEFAULT_EVENT_OFFSET = 7.0
                const eventOffset = ref(DEFAULT_EVENT_OFFSET)
                const showThumbnails = ref(true)
                const pendingMarkerId = ref(null)
                const undoStack = ref([])
                const redoStack = ref([])
                let restoring = true, openGeneration = 0, persistTimer = null
                /**
                 * Debounce on the draft write.
                 *
                 * Long enough that a drag across the timeline writes once instead of once
                 * per pointermove, short enough that what it protects is a corner case
                 * rather than the normal way out of the page. Injectable so the exit guard
                 * can be exercised without racing this.
                 */
                let PERSIST_DELAY_MS = 500
                const persistDelay = { get: () => PERSIST_DELAY_MS, set: (ms) => { PERSIST_DELAY_MS = ms } }
                const storageNotice = ref('')
                /**
                 * Editor state that exists only in this tab and is not written down yet.
                 *
                 * The draft lives in localStorage, so a reload normally costs nothing —
                 * but between an edit and the debounced write there is a window where
                 * closing the tab really does lose work, and the browser's own "leave
                 * site?" prompt is the only warning that arrives in time. This is set
                 * synchronously by every edit and cleared only once a write succeeded, so
                 * a failed write keeps the warning up rather than hiding the problem.
                 */
                const edited = ref(false)

                function markEditsDirty() {
                    edited.value = true
                    // The listener is only attached while there is something to lose, so
                    // an ordinary refresh with nothing pending stays silent.
                    if (typeof window !== 'undefined') window.addEventListener('beforeunload', onBeforeUnload)
                    // Schedule the write here rather than from a watcher: a segment is
                    // edited in place, so the array identity a watcher sees never changes
                    // and the edit would wait for some unrelated update to be saved.
                    schedulePersist()
                }
                function clearEditsDirty() {
                    edited.value = false
                    if (typeof window !== 'undefined') window.removeEventListener('beforeunload', onBeforeUnload)
                }

                /**
                 * The "unsaved data" guard.
                 *
                 * Chrome ignores whatever message is set here and shows its own generic
                 * text, so the string is not the point — the return value is. Custom text
                 * is kept because the specification still asks for one.
                 *
                 * Nothing is written from here on purpose. A synchronous `localStorage`
                 * write during `beforeunload` suppresses the prompt entirely: the handler
                 * runs, the draft is saved, and the user is never warned — the one outcome
                 * this feature exists to prevent. The draft's real safety net is the
                 * debounced write plus the flush on `pagehide`, so this handler only has to
                 * answer the question the user is being asked.
                 */
                function onBeforeUnload(event) {
                    if (!edited.value) return undefined
                    event.preventDefault()
                    event.returnValue = '本页可能有未保存的编辑数据，确定要离开吗？'
                    return event.returnValue
                }

                // ------------------------------------------------------- derived
                const videoStream = computed(() => (detail.value?.streams || []).find(s => s.type === 'video'))
                const fps = computed(() => {
                    const f = videoStream.value?.fps
                    return f && f > 0 && f < 1000 ? f : 30
                })
                const duration = computed(() => {
                    const d = lanes.value?.durationSeconds ?? detail.value?.durationSeconds
                    return d && d > 0 ? d : 0
                })
                /**
                 * Viewport width as *reactive* state.
                 *
                 * Reading `element.clientWidth` inside a computed looks fine but is not:
                 * Vue cannot track a DOM property, so the value is captured once — very
                 * possibly before layout settles — and then never recomputed. That is
                 * why the playhead only lined up with the mouse after a zoom: zoom is
                 * reactive, so it forced a recompute with a correct width. A
                 * ResizeObserver feeds this ref instead.
                 */
                const viewportWidth = ref(0)
                let resizeObserver = null

                function observeViewport() {
                    const el = viewport.value
                    if (!el || typeof ResizeObserver === 'undefined') return
                    if (resizeObserver) resizeObserver.disconnect()
                    resizeObserver = new ResizeObserver(() => {
                        const w = el.clientWidth
                        if (w > 0 && w !== viewportWidth.value) {
                            viewportWidth.value = w
                            scheduleKeyframeLoad()
                        }
                    })
                    resizeObserver.observe(el)
                    viewportWidth.value = el.clientWidth
                }

                const contentWidth = computed(() => Math.max(1, viewportWidth.value || 1) * zoom.value)
                const pxPerSecond = computed(() => duration.value > 0 ? contentWidth.value / duration.value : 1)
                const timeToPct = (t) => duration.value > 0 ? (t / duration.value) * 100 : 0
                const widthToPct = (a, b) => duration.value > 0 ? ((b - a) / duration.value) * 100 : 0
                const pxToTime = (px) => px / Math.max(pxPerSecond.value, 1e-9)

                /** Time range currently on screen; drives keyframe and spectrum fetches. */
                const viewWindow = computed(() => {
                    const el = viewport.value
                    if (!el || !duration.value) return { from: 0, to: duration.value || 0 }
                    return {
                        from: Math.max(0, pxToTime(scrollLeft.value)),
                        to: Math.min(duration.value, pxToTime(scrollLeft.value + (viewportWidth.value || el.clientWidth)))
                    }
                })

                /**
                 * Ruler ticks, generated only for the visible window.
                 *
                 * Spanning the whole duration looks equivalent but is not: at high zoom
                 * the step shrinks to a fraction of a second and a six-hour recording
                 * asks for hundreds of thousands of tick elements, which locks up the
                 * browser. Real NLEs draw the ruler for the viewport for this reason.
                 */
                const rulerTicks = computed(() => {
                    if (!duration.value) return []
                    const { from, to } = viewWindow.value
                    const raw = 100 / Math.max(pxPerSecond.value, 1e-9)
                    const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400, 28800]
                    const step = steps.find(s => s >= raw) || steps[steps.length - 1]
                    const minorStep = step / 5
                    const showMinor = minorStep * pxPerSecond.value > 7
                    const first = Math.floor(Math.max(0, from - step) / step) * step
                    const last = Math.min(duration.value, to + step)
                    const out = []
                    for (let t = first; t <= last + 1e-6 && out.length < 400; t += step) {
                        if (t < 0 || t > duration.value) continue
                        const minors = []
                        if (showMinor) {
                            for (let k = 1; k < 5; k++) {
                                const mt = t + minorStep * k
                                if (mt < duration.value && mt >= 0) minors.push(mt)
                            }
                        }
                        out.push({ t, label: step < 1 ? tc(t) : fmtDur(t), minors })
                    }
                    return out
                })

                const exportable = computed(() =>
                    segments.value.filter(s => s.selected && s.end != null && s.end > s.start))

                function newSegment(start, end, name) {
                    return { id: crypto.randomUUID?.() || 's' + Date.now().toString(36) + Math.random().toString(36).slice(2), start: round3(start), end: end == null ? null : round3(end), name: name || '', selected: true }
                }
                function sortSegments() {
                    const active = segments.value[activeSeg.value]
                    segments.value.sort((a, b) => a.start - b.start)
                    activeSeg.value = active ? segments.value.indexOf(active) : -1
                }

                // ------------------------------------------------------- transport
                function seekToTime(t, { center = false } = {}) {
                    if (!Number.isFinite(t)) return
                    const clamped = Math.max(0, Math.min(duration.value || 0, t))
                    // A far jump leaves the player showing a stale frame until the new
                    // fragment arrives (transcoded on demand, so up to a couple of
                    // seconds). Cover that gap with a still of the destination frame.
                    const far = Math.abs(clamped - currentTime.value) > FAR_SEEK_SECONDS
                    currentTime.value = clamped
                    pendingSeek = clamped
                    seeking.value = true
                    if (far) {
                        scrubPreview.value = true
                        scheduleScrubFrame(clamped)
                    }
                    applyPendingSeek()
                    if (center) centerOn(clamped)
                }
                function applyPendingSeek() {
                    const el = player.value
                    if (!el || pendingSeek == null || el.readyState === 0) return
                    if (Math.abs(el.currentTime - pendingSeek) > 0.01) el.currentTime = pendingSeek
                    onSeeked()
                }
                function centerOn(t) {
                    const el = viewport.value
                    if (!el || !duration.value) return
                    el.scrollLeft = (t / duration.value) * el.scrollWidth - el.clientWidth / 2
                }
                function stepFrames(n) { pause(); seekToTime(currentTime.value + n / fps.value) }
                function stepSeconds(n) { seekToTime(currentTime.value + n) }

                /** Jump to the adjacent keyframe; a frame of slack skips the current one. */
                function jumpKeyframe(dir) {
                    if (!keyframes.value.length) return
                    const slack = 1 / fps.value
                    const target = dir > 0
                        ? keyframes.value.find(k => k > currentTime.value + slack)
                        : [...keyframes.value].reverse().find(k => k < currentTime.value - slack)
                    if (target != null) { pause(); seekToTime(target, { center: true }) }
                }
                function jumpSegment(dir) {
                    if (!segments.value.length) return
                    const i = activeSeg.value
                    const next = i < 0
                        ? (dir > 0 ? 0 : segments.value.length - 1)
                        : Math.max(0, Math.min(segments.value.length - 1, i + dir))
                    activeSeg.value = next
                    seekToTime(segments.value[next].start, { center: true })
                }
                function play() {
                    const el = player.value
                    if (!el) return
                    applyPendingSeek()
                    el.play().catch(e => {
                        if (e.name !== 'AbortError') message.value = '无法播放：' + e.message
                    })
                }
                function pause() { const el = player.value; if (el) el.pause() }
                function togglePlay() { playing.value ? pause() : play() }
                function setRate(r) {
                    if (!Number.isFinite(r)) return
                    rate.value = Math.max(0.1, Math.min(16, r))
                    if (player.value) player.value.playbackRate = rate.value
                }
                function nudgeRate(dir) {
                    // ∛2 per press, as LosslessCut uses, so three presses ≈ 2x.
                    const factor = Math.pow(2, 1 / 3)
                    let next = rate.value * (dir > 0 ? factor : 1 / factor)
                    if ((rate.value < 1 && next > 1) || (rate.value > 1 && next < 1)) next = 1
                    setRate(next)
                }

                // -------------------------------------------------- segment editing
                function editSnapshot() {
                    return JSON.stringify({ segments: segments.value, active: activeSeg.value, pending: pendingMarkerId.value })
                }
                function rememberEdit(before = editSnapshot()) {
                    markEditsDirty()
                    undoStack.value.push(before)
                    if (undoStack.value.length > 80) undoStack.value.shift()
                    redoStack.value = []
                }
                function restoreEdit(snapshot) {
                    markEditsDirty()
                    const d = JSON.parse(snapshot)
                    segments.value = d.segments; activeSeg.value = d.active; pendingMarkerId.value = d.pending
                }
                function undoEdit() {
                    if (!undoStack.value.length) return
                    redoStack.value.push(editSnapshot()); restoreEdit(undoStack.value.pop())
                }
                function redoEdit() {
                    if (!redoStack.value.length) return
                    undoStack.value.push(editSnapshot()); restoreEdit(redoStack.value.pop())
                }
                function segmentError(candidate, excluded = []) {
                    const { start, end } = candidate
                    if (!Number.isFinite(start) || start < 0 || start >= duration.value) return '开始标记必须在录像范围内'
                    if (end != null && (!Number.isFinite(end) || end > duration.value || end - start < 0.001 - 1e-9)) return '终点必须在起点之后，且不能超出录像'
                    for (const other of segments.value) {
                        if (excluded.includes(other)) continue
                        const overlap = end == null
                            ? (other.end == null ? Math.abs(start - other.start) < 0.001 : start >= other.start && start < other.end)
                            : other.end == null
                                ? other.start >= start && other.start < end
                                : start < other.end && end > other.start
                        if (overlap) return '此范围与已有片段或开始标记重叠，请先调整边界'
                    }
                    return ''
                }
                function updateSegment(s, start, end, record = true) {
                    const rawError = segmentError({ ...s, start, end }, [s])
                    if (rawError) { message.value = rawError; return false }
                    const next = { ...s, start: round3(start), end: end == null ? null : Math.min(duration.value, round3(end)) }
                    const error = segmentError(next, [s])
                    if (error) { message.value = error; return false }
                    if (s.start === next.start && s.end === next.end) return true
                    if (record) rememberEdit()
                    markEditsDirty()
                    Object.assign(s, next)
                    if (s.end != null && pendingMarkerId.value === s.id) pendingMarkerId.value = null
                    message.value = ''
                    return true
                }
                function setSegmentBound(which) {
                    const s = segments.value[activeSeg.value]
                    if (!s) {
                        if (which === 'start') addSegmentAtPlayhead()
                        else message.value = '请先用 I 或「＋片段」设置开始标记'
                        return
                    }
                    if (updateSegment(s, which === 'start' ? currentTime.value : s.start, which === 'end' ? currentTime.value : s.end)) sortSegments()
                }
                function editSegmentInput(i, which, e) {
                    const s = segments.value[i]
                    const value = e.target.value.trim()
                    const number = value === '' ? (which === 'end' ? null : NaN) : Number(value)
                    updateSegment(s, which === 'start' ? number : s.start, which === 'end' ? number : s.end)
                    e.target.value = s[which] ?? ''
                    sortSegments()
                }
                function clearSegmentEnd() {
                    const s = segments.value[activeSeg.value]
                    if (s) updateSegment(s, s.start, null)
                }
                function splitAtPlayhead() {
                    const s = segments.value[activeSeg.value], at = round3(currentTime.value)
                    if (!s || s.end == null || at <= s.start || at >= s.end) { message.value = '光标必须位于所选片段内部'; return }
                    rememberEdit()
                    const right = { ...newSegment(at, s.end, s.name), selected: s.selected }
                    s.end = at; segments.value.push(right); sortSegments()
                }
                function removeSegment(i) {
                    if (!segments.value[i]) return
                    rememberEdit()
                    if (pendingMarkerId.value === segments.value[i].id) pendingMarkerId.value = null
                    const active = segments.value[activeSeg.value]
                    segments.value.splice(i, 1); activeSeg.value = segments.value.indexOf(active)
                }
                const mergeCandidates = computed(() => segments.value.filter(s => s.selected && s.end != null))
                function mergeSegments() {
                    const list = mergeCandidates.value
                    if (list.length < 2) { message.value = '请勾选至少两个有终点的片段'; return }
                    const merged = newSegment(Math.min(...list.map(s => s.start)), Math.max(...list.map(s => s.end)), list.map(s => s.name).filter(Boolean).join(' + '))
                    const error = segmentError(merged, list)
                    if (error) { message.value = '合并范围包含未勾选的片段或标记，请先调整勾选'; return }
                    rememberEdit()
                    segments.value = segments.value.filter(s => !list.includes(s))
                    segments.value.push(merged); activeSeg.value = segments.value.length - 1; sortSegments()
                    message.value = '已合并勾选片段（包含中间间隔），可撤销'
                }

                // --------------------------------------------------------- snapping
                /**
                 * Snap candidates: keyframes, other clip edges, the playhead and the ends
                 * of the recording. Without this, trimming to a keyframe by hand is
                 * guesswork — and a start that misses a keyframe is exactly what makes
                 * ffmpeg back up further than the user asked for.
                 */
                function snapTargets(excludeIndex) {
                    const out = [0, duration.value, currentTime.value]
                    if (showKeyframes.value && keyframesUseful.value) for (const k of keyframes.value) out.push(k)
                    segments.value.forEach((s, i) => {
                        if (i === excludeIndex) return
                        out.push(s.start)
                        if (s.end != null) out.push(s.end)
                    })
                    return out
                }
                function applySnap(t, excludeIndex) {
                    if (!snap.value) return t
                    const threshold = 8 / Math.max(pxPerSecond.value, 1e-9)
                    let best = t, bestDist = threshold
                    for (const target of snapTargets(excludeIndex)) {
                        const d = Math.abs(target - t)
                        if (d < bestDist) { bestDist = d; best = target }
                    }
                    return best
                }

                // ------------------------------------------------------------ drag
                /**
                 * Still-frame scrub preview.
                 *
                 * Issuing a `currentTime` write on every pointermove makes hls.js abort
                 * and restart fragment loads dozens of times a second, which leaves the
                 * player stuck. Throttle real seeks and allow the current decode to
                 * settle while coalescing mouse movement to the latest destination.
                 * A still frame covers slow fragment loads; release commits the exact
                 * destination and restores the previous playback intent.
                 */
                // ------------------------------------------------- scrub frames
                //
                // Keep one frame request in flight and coalesce pointer moves to the
                // latest destination. Speculative neighbour requests compete with HLS
                // for the same slow connection and NAS seeks.
                const FRAME_WIDTH = 720
                const FRAME_CACHE_MAX = 300
                const frameCache = new Map()      // bucket key -> URL
                const frameRevision = ref(0)
                let frameRequest = null
                let scrubSeekTimer = null, lastScrubSeek = 0

                /** Bucket size adapts to zoom: zoomed out, half-second steps are invisible. */
                function frameBucketSeconds() {
                    const pxPerSecondNow = pxPerSecond.value
                    if (pxPerSecondNow >= 8) return 0.25
                    if (pxPerSecondNow >= 1) return 0.5
                    return 1
                }
                function frameKey(t) {
                    return Math.min(duration.value, Math.round(t / frameBucketSeconds()) * frameBucketSeconds())
                }
                function frameUrlFor(key) {
                    return `/api/media/${selected.value.id}/frame?t=${key.toFixed(3)}&w=${FRAME_WIDTH}`
                }
                function cachePut(key, url) {
                    if (frameCache.has(key)) URL.revokeObjectURL(frameCache.get(key))
                    frameCache.delete(key)
                    frameCache.set(key, url)
                    frameRevision.value++
                    while (frameCache.size > FRAME_CACHE_MAX) {
                        const oldest = frameCache.keys().next().value
                        URL.revokeObjectURL(frameCache.get(oldest))
                        frameCache.delete(oldest)
                    }
                }
                /**
                 * Green marks for timestamps whose frame is already local.
                 *
                 * Two sources are unioned: this session's LRU (immediate) and the host's
                 * on-disk frame cache (survives reloads). Drawn bucketed to the current
                 * pixel grid so a densely cached region reads as a solid bar rather than
                 * thousands of nodes — the same idea as After Effects shading cached
                 * frames on the time ruler.
                 */
                const serverCachedTimes = ref([])
                const cachedMarks = computed(() => {
                    frameRevision.value
                    if (!duration.value) return []
                    const keys = new Set(frameCache.keys())
                    const out = new Map()
                    const bucket = frameBucketSeconds()
                    for (const k of keys) {
                        const t = Number(k)
                        if (t >= 0 && t <= duration.value) out.set(Math.round(t), true)
                    }
                    const serverBucket = Math.max(1, Math.round(bucket))
                    for (const t of serverCachedTimes.value) {
                        const snapped = Math.round(t / serverBucket) * serverBucket
                        out.set(snapped, true)
                    }
                    return [...out.keys()].map(t => timeToPct(t))
                })

                async function loadCachedFrameIndex() {
                    if (!selected.value) { serverCachedTimes.value = []; return }
                    const generation = openGeneration
                    try {
                        const r = await fetch(`/api/media/${selected.value.id}/frames/cached?w=${FRAME_WIDTH}`)
                        const times = r.ok ? ((await r.json()).times || []) : []
                        if (generation === openGeneration) serverCachedTimes.value = times
                    } catch (e) { if (generation === openGeneration) serverCachedTimes.value = [] }
                }

                /** The bucket the playhead is currently asking for; stale replies are dropped. */
                let latestFrameKey = null

                /**
                 * Cache keys are source seconds, so changing zoom cannot reinterpret a
                 * cached frame as a different timestamp. Never paint after seek settles.
                 */
                function scheduleScrubFrame(t) {
                    if (!selected.value) return
                    const key = frameKey(t)
                    latestFrameKey = key
                    const cached = frameCache.get(key)
                    if (cached) {
                        scrubFrameUrl.value = cached
                        return
                    }
                    if (!frameRequest && !frameTimer) frameTimer = setTimeout(fetchScrubFrame, 70)
                }
                async function fetchScrubFrame() {
                    frameTimer = null
                    const key = latestFrameKey
                    if (key == null || !selected.value || frameRequest) return
                    const controller = new AbortController()
                    frameRequest = controller
                    try {
                        const r = await fetch(frameUrlFor(key), { signal: controller.signal })
                        if (!r.ok) return
                        const blob = await r.blob()
                        if (controller.signal.aborted) return
                        const url = URL.createObjectURL(blob)
                        cachePut(key, url)
                        if (key === latestFrameKey && scrubPreview.value) scrubFrameUrl.value = url
                    } catch (e) { /* keep the last frame while loading or cancelling */ }
                    finally {
                        if (frameRequest === controller) {
                            frameRequest = null
                            if (latestFrameKey != null && latestFrameKey !== key && !frameCache.has(latestFrameKey)) {
                                frameTimer = setTimeout(fetchScrubFrame, 70)
                            }
                        }
                    }
                }
                function clearScrubFrame() {
                    clearTimeout(frameTimer)
                    frameTimer = null
                    latestFrameKey = null
                    frameRequest?.abort()
                    frameRequest = null
                    scrubFrameUrl.value = null
                    scrubPreview.value = false
                }
                function beginScrub(e) {
                    if (e.button !== 0) return
                    const el = viewport.value
                    if (!el) return
                    drag.value = { kind: 'scrub', resume: player.value && !player.value.paused }
                    pause()
                    stopThumbnails()
                    closeHoverPreview()
                    scrubPreview.value = true
                    el.setPointerCapture?.(e.pointerId)
                    applyScrub(e, el)
                }
                function applyScrub(e, el) {
                    if (!(duration.value > 0)) return
                    const rect = el.getBoundingClientRect()
                    const raw = pxToTime(e.clientX - rect.left + el.scrollLeft)
                    if (!isFinite(raw)) return
                    const t = Math.max(0, Math.min(duration.value, raw))
                    // Move the playhead immediately; video follows at a bounded rate.
                    currentTime.value = t
                    scrubPreview.value = true
                    scheduleScrubFrame(t)
                    scheduleScrubSeek()
                }
                function scheduleScrubSeek() {
                    if (scrubSeekTimer) return
                    scrubSeekTimer = setTimeout(() => {
                        scrubSeekTimer = null
                        if (drag.value?.kind !== 'scrub') return
                        const el = player.value, target = currentTime.value
                        // Let an in-flight decode finish before requesting the newest
                        // position. A stalled request gets replaced after one second.
                        if (el && (!el.seeking || performance.now() - lastScrubSeek > 1000)) {
                            if (Math.abs(el.currentTime - target) > 0.1 || el.readyState === 0) {
                                pendingSeek = target; seeking.value = true
                                applyPendingSeek(); lastScrubSeek = performance.now()
                            }
                            refreshBuffered()
                        }
                        scheduleScrubSeek()
                    }, 160)
                }
                /** Called when a real seek completes, revealing the video again. */
                function onSeeked() {
                    const el = player.value
                    if (!el || pendingSeek == null) return
                    if (drag.value?.kind === 'scrub') {
                        if (!el.seeking && el.readyState >= 2 && Math.abs(el.currentTime - currentTime.value) < 0.25) clearScrubFrame()
                        return
                    }
                    // A stale seeked/canplay event must not release a newer target.
                    if (el.seeking || el.readyState < 2 || Math.abs(el.currentTime - pendingSeek) > 0.25) return
                    pendingSeek = null
                    seeking.value = false
                    buffering.value = false
                    clearScrubFrame()
                }
                function beginClipDrag(e, index, kind) {
                    e.stopPropagation(); e.preventDefault()
                    if (e.button !== 0) return
                    const s = segments.value[index]
                    if (!s) return
                    activeSeg.value = index
                    const rect = track.value.getBoundingClientRect()
                    drag.value = {
                        kind, index,
                        before: editSnapshot(),
                        origStart: s.start,
                        origEnd: s.end,
                        grabTime: pxToTime(e.clientX - rect.left)
                    }
                    e.target.setPointerCapture?.(e.pointerId)
                }
                function onPointerMove(e) {
                    const d = drag.value
                    if (!d) return
                    if (d.kind === 'resize') {
                        d.object[d.key] = clamp(d.initial + ((d.axis === 'x' ? e.clientX : e.clientY) - d.origin) * d.direction, d.min, d.max)
                        return
                    }
                    if (d.kind === 'scrub') {
                        const el = viewport.value
                        if (el) applyScrub(e, el)
                        return
                    }
                    const s = segments.value[d.index]
                    if (!s || !track.value) return
                    const rect = track.value.getBoundingClientRect()
                    const delta = pxToTime(e.clientX - rect.left) - d.grabTime
                    if (d.kind === 'move') {
                        const len = (d.origEnd ?? d.origStart) - d.origStart
                        const start = Math.max(0, Math.min(Math.max(0, duration.value - len), applySnap(d.origStart + delta, d.index)))
                        updateSegment(s, start, d.origEnd == null ? null : start + len, false)
                    } else if (d.kind === 'trim-start') {
                        const upper = (d.origEnd ?? duration.value) - 1 / fps.value
                        updateSegment(s, Math.max(0, Math.min(upper, applySnap(d.origStart + delta, d.index))), s.end, false)
                    } else if (d.kind === 'trim-end') {
                        const lower = d.origStart + 1 / fps.value
                        updateSegment(s, s.start, Math.max(lower, Math.min(duration.value, applySnap((d.origEnd ?? d.origStart) + delta, d.index))), false)
                    }
                }
                /**
                 * Ends any drag. Called on pointerup, pointercancel and window blur, so a
                 * pointer released off-window (or a lost capture) cannot leave the
                 * timeline stuck in a half-dragged state.
                 */
                function endDrag() {
                    const active = drag.value
                    if (!active) return
                    drag.value = null
                    if (active.kind === 'resize') { persistEditor(); return }
                    if (active.before && active.before !== editSnapshot()) rememberEdit(active.before)
                    sortSegments()
                    if (active.kind === 'scrub') {
                        clearTimeout(scrubSeekTimer); scrubSeekTimer = null
                        // The newest request is already the one we want; just commit
                        // the position we are showing.
                        seekToTime(currentTime.value)
                        if (active.resume) play()
                    }
                    scheduleThumbnails()
                    persistEditor()
                }

                /** Abandon an in-flight scrub without committing a seek. */
                function cancelDrag() {
                    if (!drag.value) { activeSeg.value = -1; return }
                    const resume = drag.value.resume
                    if (drag.value.before) restoreEdit(drag.value.before)
                    drag.value = null
                    clearTimeout(scrubSeekTimer); scrubSeekTimer = null
                    currentTime.value = pendingSeek ?? player.value?.currentTime ?? 0
                    clearScrubFrame()
                    if (resume) play()
                }
                function beginResize(e, object, key, axis = 'y', direction = 1) {
                    e.preventDefault(); e.stopPropagation()
                    const isLane = object === laneHeights.value
                    const min = isLane ? 20 : axis === 'x' ? 180 : 70
                    const otherWidth = key === 'library' ? layout.value[rightTab.value] : layout.value.library
                    const max = isLane ? 240 : axis === 'x'
                        ? Math.max(min, Math.min(600, innerWidth - otherWidth - 340))
                        : Math.max(min, object[key] + (viewport.value?.clientHeight || 110) - 110)
                    drag.value = { kind: 'resize', object, key, axis, direction, initial: object[key], origin: axis === 'x' ? e.clientX : e.clientY, min, max }
                    e.currentTarget.setPointerCapture?.(e.pointerId)
                }

                // ------------------------------------------- timeline frame pyramid
                /**
                 * The thumbnail lane refines itself instead of guessing a resolution.
                 *
                 * The lane is a pyramid: every level is the cache's own time grid — the
                 * server quantises frames to [FRAME_BUCKET] seconds — doubled, so level
                 * `L` has a step of `bucket * 2**L` and its frames are exactly the
                 * coarser level's frames plus the ones in between. Two things follow,
                 * and they are the whole design:
                 *
                 *  - A subdivision can never miss the cache. `index * step` always lands
                 *    on a bucket the server produced, so a level fills in completely
                 *    instead of leaving one stubborn cell that re-requests forever.
                 *  - Levels are independent. A coarse frame stays valid while the finer
                 *    levels around it load, so the lane is never blank: it shows the
                 *    best frame it has for every instant and sharpens in place.
                 *
                 * The lane keeps subdividing until its cells are thumb-sized, then stops
                 * — no further level can show more than the thumbnail lane has room for.
                 */
                const FRAME_BUCKET = 0.1
                /**
                 * Smallest a cell may be drawn before subdividing further is pointless.
                 *
                 * A level whose cells are narrower than this shows nothing the level above
                 * it did not, so this is what bounds the lane's work rather than any frame
                 * count.
                 */
                const MIN_PX_PER_CELL = 10
                /**
                 * How wide a fill cell may get before it stops being fill.
                 *
                 * The rungs below the target exist to hold a picture under a gap, so they
                 * want to be clearly wider than the target — but one frame standing in for
                 * half the window is a still, not a strip, and every extra rung is another
                 * round of requests. This is the width at which filling stops paying.
                 */
                const FILL_CELL_PX = 128
                /** Hard ceiling on the lane's DOM nodes; see [thumbnailBudget]. */
                const MAX_RENDERED_CELLS = 1200
                /** Never fetch mush, and never ask the server for more than it will serve. */
                const FRAME_WIDTH_MIN = 128, FRAME_WIDTH_MAX = 1920
                /**
                 * The width one cell's frame is fetched at.
                 *
                 * Two things have to be covered, and the larger of them wins:
                 *
                 *  - the lane's **height**. Every frame is stored as the 16:9 window the
                 *    lane draws in, so `height * 16/9` is exactly the width whose crop
                 *    reaches the lane's top and bottom edges.
                 *  - the **cell's own width**, because a wide cell — a fill cell, or any
                 *    cell at a shallow zoom — stretches its frame sideways to cover the box.
                 *
                 * Both are read when the frame is asked for, so dragging the lane taller
                 * sharpens the strip instead of leaving it upscaled for the session; see
                 * `frameReady` for how the lane notices that its frames are a rung behind.
                 * The answer is rounded onto the power-of-two ladder the cache is built on,
                 * so a drag crosses a rung once per doubling and settles on a handful of
                 * widths rather than a new one per pixel.
                 */
                function thumbFrameWidth(cellPx) {
                    return clamp(scale2(Math.ceil(Math.max(laneHeights.value.thumbnails, 1) * 16 / 9, cellPx || 0)),
                        FRAME_WIDTH_MIN, FRAME_WIDTH_MAX)
                }
                /**
                 * The lane's own rung — the width its height alone asks for.
                 *
                 * Watched rather than recomputed: crossing it is the one moment the frames
                 * in memory stop matching the lane, and the sweep the server is running is
                 * a sweep at the old width.
                 */
                const thumbLaneWidth = computed(() => thumbFrameWidth(0))
                /**
                 * The popup's width: a fixed rung, deliberately not a function of the lane.
                 *
                 * Its box is capped at [HOVER_MAX_HEIGHT], which 512 px covers many times
                 * over, and a fixed rung is what lets a hovered instant stay cached while
                 * the lane around it is being resized.
                 */
                const HOVER_WIDTH = 512
                /**
                 * How many frames the lane keeps decoded.
                 *
                 * A screenful of the ladder is its rungs summed — a few hundred — and
                 * dropping below that would make the lane re-request what it must show,
                 * which is both wasted work and a visibly flickering strip.
                 */
                const THUMB_CACHE_MAX = 1200, HOVER_CACHE_MAX = 90
                /** Cells one plan may carry on screen, and beyond it, respectively. */
                const MAX_PLANNED_CELLS = 320
                const MAX_MARGIN_CELLS = 160
                /**
                 * Requests in flight at once.
                 *
                 * A browser opens about six connections to one origin; leaving the last
                 * two spare is what keeps the hover frame from queueing behind the
                 * sweep, on top of the server reserving a lane for it.
                 */
                const FETCH_CONCURRENCY = 4

                function scale2(w) { return 2 ** Math.ceil(Math.log2(Math.max(16, w))) }

                /** Newest request generation; anything older must not paint. */
                let thumbGeneration = 0
                let planTimer = null
                const thumbAbort = new Set()
                let thumbActive = 0
                let thumbPlannedAt = 0

                /** Key `level:time` -> { url, w } for the two pools the lane draws from. */
                const thumbnailCache = new Map()
                const hoverCache = new Map()
                const thumbnailRevision = ref(0)
                /** Thumbnail cells waiting to be fetched, deduplicated by key. */
                const thumbQueued = new Map()
                /** Levels already asked of the server's sweep route for this window. */
                const sweepRequested = new Set()
                /** Per level, the interval that has already been enumerated. */
                const thumbEnum = new Map()

                /** `bucket * 2**level`; level 0 is the cache's own grid. */
                function levelStep(level) { return FRAME_BUCKET * 2 ** level }
                /** Six hours in 20 s cells is level 18; nothing legitimate comes near this. */
                const MAX_LEVEL = 24
                /**
                 * The coarsest level whose cells are still at least [step] seconds wide.
                 *
                 * Rounding to the *nearest* level sometimes picks one whose cells are a
                 * third narrower than asked for — cells visibly smaller than the frame they
                 * hold — so this errs coarse on purpose. Every rung of the ladder then
                 * satisfies the size floor, and the lane never draws a sliver.
                 */
                /**
                 * The coarsest level whose cells are still at least [step] seconds wide.
                 *
                 * Counted rather than derived from `log2`: a step that is an exact power of
                 * two has to land *on* a rung, and floating point decides whether the ratio
                 * comes out as 16 or 16.000000000000004 — which a logarithm rounds the
                 * wrong way, collapsing the ladder onto one rung. Comparing exact powers of
                 * two has no such boundary.
                 */
                function levelForStep(step) {
                    let level = 0
                    while (levelStep(level) < step && level < MAX_LEVEL) level++
                    return level
                }

                /**
                 * The level the lane subdivides towards: the last one whose cells are still
                 * narrower than a thumbnail.
                 *
                 * Both bounds are about the *lane*, not the recording. A cell of 124 px is
                 * a thumbnail; past that, subdividing again would only upscale a wider
                 * frame for nothing. A cell of [MIN_PX_PER_CELL] is the floor — narrower
                 * than that there is no picture left to see — and it is what makes the
                 * lane's cost bounded whatever the recording's length or the zoom.
                 */
                const thumbnailTarget = computed(() => {
                    const pps = pxPerSecond.value
                    if (!(pps > 0)) return 0
                    const thumbPx = Math.max(96, laneHeights.value.thumbnails * 16 / 9)
                    const floor = levelForStep(MIN_PX_PER_CELL / pps)
                    const ideal = levelForStep(thumbPx / pps)
                    return Math.max(floor, ideal - 1)
                })

                /**
                 * How many cells the lane may draw, derived from the rules above.
                 *
                 * Because every rung's cells nest inside the one above, a whole ladder
                 * covers only about twice what its finest rung does, and that rung is
                 * `viewport / MIN_PX_PER_CELL` cells by construction. So this is not a
                 * guess about what fits: it is what the ladder already is, with headroom
                 * for the margin either side of the window. [MAX_RENDERED_CELLS] is only a
                 * backstop against arithmetic nobody anticipated.
                 */
                const thumbnailBudget = computed(() =>
                    Math.min(MAX_RENDERED_CELLS, Math.ceil((viewportWidth.value || 1) * 3 / MIN_PX_PER_CELL) + 32)
                )

                function frameKey(level, t) { return level + ':' + round3(t) }
                function thumbnailUrl(cell) {
                    thumbnailRevision.value
                    return thumbnailCache.get(frameKey(cell.level, cell.t))?.url || null
                }
                /** How wide a cell is drawn right now, in CSS px. */
                function cellPx(cell) { return (cell.end - cell.t) * (pxPerSecond.value || 0) }
                /**
                 * Whether the lane already holds a frame *at the width it would ask for now*.
                 *
                 * The pool is not a set of answers, it is the best picture the lane has for
                 * an instant: a frame cut for a shorter lane is still drawn, because going
                 * blank while its replacement loads is worse. What it must not do is satisfy
                 * the plan — otherwise dragging the lane taller would leave the strip
                 * upscaled for the rest of the session, since nothing would ever ask again.
                 */
                function frameReady(cell) {
                    return thumbnailCache.get(frameKey(cell.level, cell.t))?.w === thumbFrameWidth(cellPx(cell))
                }
                /**
                 * Whether a cell is wide enough to carry its own timecode.
                 *
                 * The label is wider than a narrow cell, so drawing it regardless is what
                 * turns a refined strip back into an unreadable smear of numbers. Only the
                 * cells with room for it keep it, and the coarser rungs — which are wide by
                 * construction — end up carrying the times.
                 */
                function showCellTime(cell) {
                    return cellPx(cell) >= 44
                }

                /**
                 * The visible window, widened by half a screen on each side.
                 *
                 * Both the lane and the plan are built from this rather than from the
                 * grid: at a coarse level a whole recording is a handful of seconds per
                 * pixel, so enumerating cells that are off screen is asking for frames
                 * nothing will ever draw — and it is what would keep a six-hour recording
                 * from fitting in the frame budget.
                 */
                const frameWindow = computed(() => {
                    const { from, to } = viewWindow.value
                    const span = Math.max(0, to - from)
                    const margin = Math.max(2, span * 0.5)
                    return {
                        from: Math.max(0, from - margin),
                        to: Math.min(duration.value || 0, to + margin),
                        from0: from, to0: to
                    }
                })

                function cellAt(level, t) {
                    const start = round3(t)
                    return { level, t: start, end: Math.min(duration.value, start + levelStep(level)) }
                }

                /** Every cell of [level] inside [window], memoised per window. */
                function cellsForLevel(level, window) {
                    const step = levelStep(level), stride = Math.round(step / FRAME_BUCKET)
                    const span = window.to - window.from
                    if (!(span > 0)) return []
                    const lastIndex = Math.ceil(duration.value / step) * stride
                    const rawLo = Math.floor(window.from / step) * stride
                    const rawHi = Math.ceil(window.to / step) * stride
                    // The memo key is the *requested* interval, not the clamped one: two
                    // windows that both clamp to the same range would otherwise share an
                    // answer computed for a different screen.
                    const lo = clamp(rawLo, 0, lastIndex)
                    const hi = clamp(rawHi, lo, lastIndex)
                    const key = level + ':' + rawLo + ':' + rawHi
                    const memo = thumbEnum.get(key)
                    if (memo) return memo
                    const cells = []
                    for (let b = lo; b <= hi && cells.length <= MAX_RENDERED_CELLS; b += stride) {
                        const t = round3(b * FRAME_BUCKET)
                        if (t > duration.value) break
                        cells.push(cellAt(level, t))
                    }
                    // Keyed by interval so a scroll back to the same window is free; the
                    // cap keeps the memo from pinning every window ever scrolled past.
                    if (thumbEnum.size > 64) thumbEnum.clear()
                    thumbEnum.set(key, cells)
                    return cells
                }

                /**
                 * The coarsest level the lane will consider for its fill layers.
                 *
                 * Aimed at half a screenful per cell: any coarser and one frame would stand
                 * in for more of the timeline than the user can see at once, which is a
                 * still rather than a strip.
                 */
                function fillFloorLevel() {
                    return levelForStep(FILL_CELL_PX / Math.max(pxPerSecond.value, 1e-9))
                }

                /**
                 * The rungs the lane draws and fetches: the level it is refining towards,
                 * then every other level down to [fillFloorLevel].
                 *
                 * The rungs below the target are the *fill*: much wider cells that hold a
                 * picture under a gap while the target's frames arrive, so a screenful is
                 * never blank. Only this ladder is ever drawn — a frame left in memory by an
                 * earlier zoom is data, not a layer, and adopting one as fill is what paves
                 * the strip with unreadable slivers.
                 */
                function planLevels() {
                    // Level numbers grow downwards towards ever coarser cells, so the walk
                    // runs from the target *up* to the fill floor, never past the target.
                    const finest = thumbnailTarget.value
                    let coarsest = fillFloorLevel()
                    if (coarsest < finest) coarsest = finest
                    const levels = []
                    for (let level = finest; level < coarsest; level += 2) levels.push(level)
                    levels.push(coarsest)
                    return levels
                }

                /**
                 * Cells on screen, coarse level first so a finer one paints over it.
                 *
                 * Two rules, and between them they are the whole visual contract:
                 *
                 *  - Only the ladder is drawn. A frame cached from an earlier zoom or an
                 *    earlier window is *data*, not a layer: honouring it here is how the
                 *    lane ends up paved with a coarse level's slivers while the level it
                 *    actually asked for has barely started.
                 *  - A cell is dropped once a finer rung already covers it. An instant is
                 *    either sharp or filled in, never both. Walking finest-first makes that
                 *    exact and cheap — every rung's cells nest inside the one above, and
                 *    each rung is sorted, so a set of the finer rung's starts settles it.
                 *
                 * The finest rung gets the frame budget first and any rung that cannot fit
                 * is folded into its coarser neighbour, so a wide view degrades into a
                 * coarser picture instead of into a half-drawn one.
                 */
                const thumbnailCells = computed(() => {
                    thumbnailRevision.value
                    if (!showThumbnails.value || !(duration.value > 0) || !(pxPerSecond.value > 0)) return []
                    const window = frameWindow.value
                    const ladder = planLevels()
                    const levels = []
                    let budget = thumbnailBudget.value
                    window.__ladder = ladder
                    for (const level of ladder) {
                        const finer = levels.length ? levels[levels.length - 1] : null
                        const finerStep = finer ? levelStep(finer[0].level) : 0
                        const finerKeys = finer ? new Set(finer.map(c => c.t)) : null
                        const kept = []
                        for (const cell of cellsForLevel(level, window)) {
                            if (cell.end <= window.from0 || cell.t >= window.to0) continue
                            // The finer rung is two levels down, so an overlap can only come
                            // from a cell this one contains: a set of its starts settles it.
                            let covered = false
                            if (finerKeys) {
                                for (let t = cell.t; t < cell.end - 1e-9; t = round3(t + finerStep)) {
                                    if (finerKeys.has(t)) { covered = true; break }
                                }
                            }
                            if (covered) continue
                            kept.push(cell)
                            if (kept.length >= budget) break
                        }
                        if (!kept.length) continue
                        budget -= kept.length
                        levels.push(kept)
                        if (budget <= 0) break
                    }
                    const out = []
                    for (let i = levels.length - 1; i >= 0; i--) {
                        for (const cell of levels[i]) out.push(cell)
                    }
                    return out
                })

                /**
                 * The work queue, in the order the lane wants the frames.
                 *
                 * The ladder is walked finest-first, and whether a coarse cell is wanted is
                 * decided by what the lane *has* at the finer rung — cached, in flight, or
                 * about to be asked for. Anything else asks for every rung everywhere, and
                 * most of those frames are dropped before they are ever drawn; with the
                 * right test, the fill rungs collapse to one frame for the whole screen,
                 * which is exactly their job.
                 *
                 * The margin around the viewport comes last, so scrolling finds frames
                 * already waiting without ever competing with what is on screen.
                 */
                const thumbnailPlan = computed(() => {
                    thumbnailRevision.value
                    if (!showThumbnails.value || !(duration.value > 0) || !(pxPerSecond.value > 0)) return []
                    const window = frameWindow.value
                    const visible = [], margin = []
                    let finerKeys = null
                    for (const level of planLevels()) {
                        const finerStep = finerKeys ? levelStep(level - 2) : 0
                        // This rung's times that the rung below may treat as present: frames
                        // at the width the lane wants now, plus whatever this pass is about
                        // to ask for. Nothing finer than that counts.
                        const present = new Set()
                        for (const cell of cellsForLevel(level, window)) {
                            const key = frameKey(level, cell.t)
                            const has = frameReady(cell) || thumbQueued.has(key)
                            // A coarse cell is only redundant once *every* instant it covers
                            // has a finer frame the lane can draw. Anything less and this is
                            // the frame that holds those instants: treating a partly loaded
                            // finer rung as full coverage is what left the strip blank while
                            // the target level arrived, because nothing was asked to fill it.
                            let covered = false
                            if (finerKeys) {
                                covered = true
                                for (let t = cell.t; t < cell.end - 1e-9; t = round3(t + finerStep)) {
                                    if (!finerKeys.has(t)) { covered = false; break }
                                }
                            }
                            if (covered && has) { present.add(cell.t); continue }
                            if (!covered && !has) {
                                const task = { level, t: cell.t, end: cell.end, key, width: thumbFrameWidth(cellPx(cell)) }
                                if (cell.end > window.from0 && cell.t < window.to0) visible.push(task)
                                else margin.push(task)
                            }
                            present.add(cell.t)
                        }
                        finerKeys = present
                    }
                    const ordered = visible.slice(0, MAX_PLANNED_CELLS)
                    for (const cell of margin) {
                        if (ordered.length >= MAX_PLANNED_CELLS + MAX_MARGIN_CELLS) break
                        ordered.push(cell)
                    }
                    return ordered
                })

                /**
                 * Puts one decoded frame in a pool, replacing whatever was there.
                 *
                 * The entry carries the width it was cut at, which is what lets the plan
                 * tell a frame that answers the lane's current height from one that merely
                 * keeps it painted while a sharper one loads.
                 */
                function rememberFrame(pool, key, frame) {
                    const stale = pool.get(key)
                    if (stale) URL.revokeObjectURL(stale.url)
                    pool.set(key, frame)
                    const cap = pool === thumbnailCache ? THUMB_CACHE_MAX : HOVER_CACHE_MAX
                    if (pool.size > cap) evictFrames(pool, cap, key)
                    thumbnailRevision.value++
                }

                /**
                 * Trims a pool from the rung the lane needs least.
                 *
                 * The target level is what the user is looking at, so it is never the one to
                 * drop; the rungs furthest from it are. Insertion order would evict whatever
                 * was fetched longest ago, which after a scroll is the fill layer the lane
                 * is still drawing over its target — the lane would quietly lose its
                 * background and go patchy.
                 */
                function evictFrames(pool, cap, justAdded) {
                    const added = Number(justAdded.split(':')[0])
                    const levels = [...new Set([...pool.keys()].map(k => Number(k.split(':')[0])))]
                    levels.sort((a, b) => Math.abs(b - added) - Math.abs(a - added))
                    for (const level of levels) {
                        if (pool.size <= cap) return
                        if (level === added) continue
                        for (const key of [...pool.keys()]) {
                            if (pool.size <= cap) return
                            if (Number(key.split(':')[0]) !== level) continue
                            URL.revokeObjectURL(pool.get(key).url)
                            pool.delete(key)
                        }
                    }
                }

                /**
                 * Decodes one frame and returns it ready to paint.
                 *
                 * `createImageBitmap` is used on purpose: it rejects on a truncated or
                 * aborted response, where an `<img>` would already be showing whatever
                 * arrived. That matters here because a pointer moving across the lane
                 * abandons requests in flight, and a torn frame on the lane is exactly the
                 * artefact that would make this look broken.
                 */
                async function fetchFrame(level, t, width, opts = {}) {
