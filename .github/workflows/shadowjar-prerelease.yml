name: Build and Publish ShadowJar Pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep an active release update intact; newer pushes replace only the pending run.
concurrency:
  group: dev-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test and package
        uses: ./.github/actions/gradle-build

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tested artifacts
        uses: actions/download-artifact@v8
        with:
          name: xhrec-build
          path: build/ci-artifacts

      - name: Update dev-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-dev-build.sh
